<style>
:root{
  --ink:#1d1b17; --paper:#f1e5c9; --paper2:#e8d8b4; --brick:#cf3b2a; --navy:#2b3a55;
  --mustard:#e3b23c; --sage:#9bb68a; --sky:#8fb3d1; --desk:#211e1a;
  --good:#3f8f4a; --bad:#c23a2b;
  --common:#8d8d8d; --uncommon:#5f9e5a; --rare:#3f78c9; --epic:#8a4fc2; --legendary:#d8a526;
  --cw:min(calc(100vw - 32px), 470px);
}
@supports (height:100dvh){ :root{ --cw:min(calc(100vw - 32px), 470px, calc((100dvh - 150px) / 1.5)); } }
:root{--qw:min(calc(100vw - 32px), 460px)}
@supports (height:100dvh){ :root{ --qw:min(calc(100vw - 32px), 460px, calc((100dvh - 150px) / 1.75)); } }
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
html.noscroll,html.noscroll body{overflow:hidden}
.pk,.lu,.zoom{overscroll-behavior:contain}
@supports (overflow:clip){html,body{overflow-x:clip}}
body{
  min-height:100vh; color:var(--paper); font-family:"Patrick Hand",system-ui,sans-serif; font-size:18px;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,220,160,.10), transparent 60%),
    radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.5), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 7px),
    var(--desk);
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
img{-webkit-touch-callout:none;-webkit-user-drag:none}
#app{max-width:1100px;margin:0 auto;padding:max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left))}

/* ---------- CARD ---------- */
.card{position:relative;width:100%;aspect-ratio:1024/1536;container-type:inline-size;user-select:none}
.card > *{position:absolute}
.card .frame{inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.card .bg{inset:0;width:100%;height:100%;z-index:0}
.t{z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;color:var(--ink);font-family:"Luckiest Guy",sans-serif}
.art-win{z-index:1;overflow:hidden;border-radius:2.5cqw;background:#2a2622}
.art-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art-back{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%, #f6ead0 0%, #e2cc9f 45%, #9c8360 100%)}
.art-back::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(#7a5a3a,#5e4329);border-top:.5cqw solid #3b2a1a;opacity:.55}
.art-back.series4{background-color:#faf4e5;background-image:linear-gradient(rgba(67,118,170,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(67,118,170,.09) 1px,transparent 1px);background-size:7% 7%;box-shadow:inset 0 0 12cqw rgba(120,87,42,.2)}
.art-back.series4::after{height:16%;background:repeating-linear-gradient(-8deg,transparent 0 9%,rgba(207,59,42,.5) 10% 12%);border:0;opacity:.65}
.art-back.series5{background:radial-gradient(circle at 50% 38%,#f0c755 0 17%,#b33a32 18% 36%,#243b5c 37% 58%,#d9c08a 59% 100%)}
.art-back.series5::after{inset:0;height:auto;border:0;background:repeating-conic-gradient(from 4deg at 50% 38%,rgba(255,244,204,.16) 0 5deg,transparent 5deg 12deg);opacity:.8}
.art-bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.9) saturate(.92)}
.art-vig{position:absolute;inset:0;background:radial-gradient(ellipse 70% 65% at 50% 55%, transparent 55%, rgba(20,12,4,.45) 100%)}
.art-img.cut{inset:1% 2% 12% 2%;width:96%;height:87%;object-fit:contain;z-index:1;filter:drop-shadow(0 1.2cqw 0 rgba(0,0,0,.25))}
/* Marvel Snap-style breakout: the character's feet stay in the picture window and only its head, arms and props
   break past the frame. The card's lettering sits on top of it, and its shadow falls opposite the tilt. */
.framebreak-character{left:4%;top:13%;width:92%;height:67.5%;object-fit:contain;object-position:50% 100%;z-index:7;transform:translate3d(0,0,0) rotate(0deg) scale(1);transform-origin:50% 100%;pointer-events:none;
  filter:drop-shadow(calc(var(--mx,0)*-1.6cqw) calc(1.2cqw + var(--my,0)*-1.2cqw) .6cqw rgba(0,0,0,.5));backface-visibility:hidden}
.card:has(> .framebreak-character) > .t{z-index:8!important}   /* lettering stays on top of a breakout character */
.card:has(> .framebreak-character) > .t.title span{-webkit-text-stroke:.7cqw #fff8e6;paint-order:stroke fill}   /* readable where it crosses the character */
.framebreak-character.cq-motion-active{will-change:transform}
/* Big single cards tilt in 3D with the phone, Marvel Snap style: the card turns, the scenery drifts the other
   way, the character drifts with the tilt, and a light glare and holo band slide across. BreakoutMotion sets
   --rx/--ry (degrees) and --mx/--my (-1..1). */
.card.tilt3d{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d}
.card.tilt3d.cq-motion-active{will-change:transform}
.card.tilt3d .art-bgimg{scale:1.08;translate:calc(var(--mx,0)*-3%) calc(var(--my,0)*-3%)}
.card.tilt3d .art-img.cut{translate:calc(var(--mx,0)*2.2%) calc(var(--my,0)*1.6%)}
.tilt-glare{position:absolute;inset:1.3% 1.7% 1.6%;z-index:6;pointer-events:none;border-radius:5cqw;mix-blend-mode:overlay;opacity:var(--glare,0);
  background:radial-gradient(circle at calc(50% + var(--mx,0)*48%) calc(42% + var(--my,0)*48%),rgba(255,255,255,.75),rgba(255,255,255,0) 46%),
    linear-gradient(115deg,transparent calc(38% + var(--mx,0)*30%),rgba(255,255,255,.35) calc(48% + var(--mx,0)*30%),rgba(170,220,255,.25) calc(53% + var(--mx,0)*30%),transparent calc(62% + var(--mx,0)*30%))}
.framebreak-character.series2{top:16%;height:64.5%}
.framebreak-character.series45{left:6%;top:12%;width:88%;height:74%}
.frame-metadata{inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.frame-metadata.top{clip-path:inset(0 0 71.7% 0)}
.frame-metadata.quote{clip-path:inset(70% 18% 17% 18%)}
.frame-metadata.footer{clip-path:inset(83% 0 0 0)}
.mn-badge.framebreak-memory{left:7.3%;top:auto;bottom:30.5%;width:18.3%;z-index:2}
html.cq-reduce-motion .framebreak-character{transform:translate3d(0,0,0) rotate(0deg) scale(1)!important;will-change:auto}
.art-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 45%, #efe2c3 0%, #d9c49b 45%, #6d5b43 100%)}
.ph-emoji{font-size:30cqw;filter:drop-shadow(0 1.2cqw 0 rgba(0,0,0,.25));transform:translateY(-4%)}
.ph-tag{position:absolute;top:9%;left:50%;transform:translateX(-50%) rotate(-3deg);font-family:"Bangers";letter-spacing:.06em;
  font-size:3.6cqw;color:var(--ink);background:rgba(255,255,255,.55);padding:.6cqw 2cqw;border:.35cqw dashed var(--ink);border-radius:1cqw;white-space:nowrap}
.stk{position:absolute;z-index:2;transform:rotate(var(--r,0deg));pointer-events:none}
.stk.note{font-family:"Patrick Hand";color:var(--ink);padding:1.4cqw 2.2cqw;line-height:1;
  box-shadow:.4cqw .6cqw 0 rgba(0,0,0,.25);border:.25cqw solid rgba(0,0,0,.55);white-space:nowrap}
.stk.emo{line-height:1;filter:drop-shadow(.4cqw .6cqw 0 rgba(0,0,0,.3))}
.stk.float{animation:float 3s ease-in-out infinite}
.stk.float2{animation:float 3.6s ease-in-out -1.2s infinite}
@keyframes float{50%{transform:rotate(var(--r,0deg)) translateY(-2.5cqw)}}
.foil{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 45%,rgba(180,220,255,.18) 52%,transparent 62%);
  background-size:300% 100%;animation:foil 4.5s linear infinite}
.lv5 .foil{background-image:linear-gradient(115deg,transparent 35%,rgba(255,236,160,.45) 45%,rgba(255,200,80,.25) 52%,transparent 62%)}
@keyframes foil{from{background-position:100% 0}to{background-position:-100% 0}}
.rays{position:absolute;inset:-30%;z-index:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.8;
  background:repeating-conic-gradient(from 0deg at 50% 45%, rgba(255,220,120,.9) 0 6deg, transparent 6deg 18deg);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* front texts */
.num{font-size:6.5cqw;letter-spacing:.02em}
.xpstrip{flex-direction:column;gap:1cqw;color:#f6ecd4;font-family:"Bangers";font-size:3.4cqw;letter-spacing:.06em}
.xpstrip i{display:block;width:80%;height:1.6cqw;border-radius:1cqw;background:rgba(0,0,0,.35);overflow:hidden;border:.25cqw solid rgba(0,0,0,.4)}
.xpstrip b{display:block;height:100%;background:linear-gradient(90deg,#f7d56a,#e3a42c)}
.cat{font-size:3.7cqw;padding:0 2cqw;letter-spacing:.045em;line-height:1.08}
.icon svg{width:70%;height:70%}
.icon img{width:92%;height:92%;object-fit:contain}
.card.special .cat,.card.special .lvl,.card.special .xpstrip{color:#fff;text-shadow:0 .3cqw 0 rgba(0,0,0,.5)}
.card.special .stars{color:#fff}
.title{flex-direction:column;gap:1.2cqw}
.title span{display:block;white-space:nowrap;letter-spacing:.035em;line-height:1.02}
.t1{color:var(--ink);text-shadow:0 .5cqw 0 rgba(0,0,0,.12)}
.t2{color:var(--brick);-webkit-text-stroke:.38cqw var(--ink);paint-order:stroke fill;text-shadow:0 .6cqw 0 rgba(0,0,0,.18)}
.quote{font-family:"Patrick Hand";font-size:6.4cqw;line-height:1.05;white-space:pre-line;transform:rotate(-2deg);
  text-decoration:underline;text-decoration-color:var(--brick);text-decoration-thickness:.45cqw;text-underline-offset:1.4cqw}
.rar{flex-direction:column;gap:1.4cqw;font-size:4.2cqw;letter-spacing:.04em}
.gem{width:9.5cqw;height:9.5cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:5.4cqw;
  border:.45cqw solid var(--ink);box-shadow:inset 0 -1cqw 0 rgba(0,0,0,.2), inset 0 .8cqw 0 rgba(255,255,255,.35)}
.r-special{background:linear-gradient(135deg,#8a4fc2,#d8a526)}
.r-common{background:var(--common)} .r-uncommon{background:var(--uncommon)} .r-rare{background:var(--rare)} .r-epic{background:var(--epic)} .r-legendary{background:var(--legendary)}
.set{flex-direction:column;gap:1cqw;font-size:4.1cqw;letter-spacing:.04em;padding:0 2cqw}
.set small{font-family:"Bangers";font-size:3.4cqw;letter-spacing:.08em}
.set hr{width:80%;border:0;border-top:.3cqw solid var(--ink);margin:0}
.lvl{flex-direction:column;gap:1.4cqw;font-size:4.5cqw;letter-spacing:.04em}
.stars{font-size:4.4cqw;letter-spacing:.1cqw;color:var(--ink)}
.stars .on{color:#e8a91d;-webkit-text-stroke:.25cqw var(--ink)}
.stars .off{opacity:.35}
.stars .new{display:inline-block;animation:starpop .7s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1)}}
.spark{z-index:4;color:#fff5c2;font-size:5cqw;text-shadow:0 0 2cqw #ffd76a;animation:twinkle 1.8s ease-in-out infinite;pointer-events:none}
@keyframes twinkle{50%{opacity:.15;transform:scale(.6)}}

/* level glows follow the card's transparent corners */
/* ----- card glow system -----
   A soft glow lives on a pseudo-element hugging the visible card (cheap box-shadow, no filters). */
.card{isolation:isolate}
.card::after{content:"";position:absolute;inset:1.3% 1.7% 1.6%;border-radius:5cqw;z-index:-1;pointer-events:none;box-shadow:var(--glow,none);transition:box-shadow .4s}
.card.lv2{--glow:0 0 2.2cqw rgba(255,255,255,.25)}
.card.special{--glow:0 0 3cqw rgba(190,120,255,.75)}
.card.cold{--glow:0 0 3cqw rgba(140,200,255,.8)}
/* neon ring that races around the edge (levels just below the top) */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.ring{position:absolute;inset:0 .4% .1%;border-radius:6.4cqw;padding:1.25cqw;z-index:-1;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0deg 150deg,var(--n1) 230deg,#fff 285deg,var(--n2) 320deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:ringspin 2.8s linear infinite}
.ring.soft{padding:2.6cqw;inset:-1.2%;filter:blur(2cqw);opacity:1}
@keyframes ringspin{to{--ang:360deg}}
.card.tier-cyan{--n1:#1fd8ff;--n2:#8ff6ff;--glow:0 0 3cqw rgba(31,216,255,.45)}
.card.tier-pink{--n1:#ff3df2;--n2:#b36bff;--glow:0 0 3cqw rgba(255,61,242,.45)}
.card.tier-max{--n1:#ffc933;--n2:#fff4b8;--glow:0 0 4cqw rgba(255,200,60,.65)}
.card.series4.tier-max{--n1:#d5322b;--n2:#fff0d4;--glow:0 0 4cqw rgba(213,50,43,.55)}
.card.tier-max .ring{animation-duration:5s}
.card.charged .ring{animation-duration:1.3s}
.card.charged{--glow:0 0 4.5cqw var(--n1)}
/* top-level gloss: lacquer shine + slow holographic sweep across the whole card */
.gloss{position:absolute;inset:1.3% 1.7% 1.6%;border-radius:5cqw;overflow:hidden;z-index:9;pointer-events:none;mix-blend-mode:overlay}
.gloss::before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 55% at 18% 0%,rgba(255,255,255,.22),transparent 50%),
    linear-gradient(120deg,transparent 38%,rgba(255,255,255,.5) 46%,rgba(255,255,255,.08) 51%,transparent 58%);
  background-size:100% 100%,300% 300%;animation:glosssweep 4.2s ease-in-out infinite}
.gloss::after{content:"";position:absolute;inset:0;opacity:.12;
  background:linear-gradient(115deg,#ff4fa0,#ffd34f,#4fffc1,#7a6bff,#ff4fa0);background-size:400% 100%;animation:holo 7s linear infinite}
@keyframes glosssweep{0%,15%{background-position:0 0,120% 0}60%,100%{background-position:0 0,-40% 0}}
@keyframes holo{to{background-position:400% 0}}
@keyframes goldglow{0%,100%{filter:drop-shadow(0 0 1.4cqw rgba(255,200,60,.7))}50%{filter:drop-shadow(0 0 3.2cqw rgba(255,210,80,1))}}
.card.locked{filter:grayscale(1) brightness(.7)}

/* memory trick art */
.mn{position:absolute;inset:0}
.mn-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mn-badge{position:absolute;left:1%;top:0;width:25%;z-index:3;transform:rotate(-10deg);filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.4))}
.mn-paper{position:absolute;left:11%;right:9%;top:15%;bottom:20%;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;
  padding:3cqw;border:.45cqw solid var(--ink);border-radius:1.6cqw;transform:rotate(-1.5deg);box-shadow:.8cqw 1cqw 0 rgba(0,0,0,.35);
  background:repeating-linear-gradient(0deg,transparent 0 6.6cqw,rgba(80,120,170,.2) 6.6cqw 6.9cqw),#fbf6e8}
.mn-tag{font-family:"Bangers";letter-spacing:.08em;font-size:4.2cqw;background:#7b4bb5;color:#fff;padding:.6cqw 2.6cqw;border-radius:1.4cqw;border:.35cqw solid var(--ink);transform:rotate(-3deg)}
.mn-row{display:flex;gap:1.2cqw;justify-content:center}
.mn-tile{aspect-ratio:.82;border:.4cqw solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(var(--r));box-shadow:.4cqw .6cqw 0 rgba(0,0,0,.3);border-radius:.8cqw}
.mn-tile b{font-family:"Luckiest Guy";font-weight:400;line-height:1;color:var(--ink)}
.mn-tile small{font-family:"Patrick Hand";color:var(--ink);line-height:1;margin-top:.5cqw;white-space:nowrap}
.mn-means{display:grid;gap:.8cqw 4cqw;font-family:"Patrick Hand";color:var(--ink);line-height:1.1}
.mn-means b{font-family:"Luckiest Guy";font-weight:400;color:#7b4bb5;margin-right:1cqw}
.ttype{display:flex;align-items:center;gap:10px;margin:14px 0 0}
.ttype img{width:56px;height:56px;object-fit:contain}
.ttype b{display:block;font-family:"Luckiest Guy";font-weight:400;font-size:20px;letter-spacing:.04em}
.ttype span{font-size:17px;opacity:.8}
.diffbox{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.dcol{border:2px solid var(--ink);border-radius:12px;padding:10px;font-size:16px}
.dcol.a{background:#ffe3b8} .dcol.b{background:#cfe3ff}
.dcol b{display:block;font-family:"Luckiest Guy";font-weight:400;font-size:20px;letter-spacing:.04em}
.dcol i{display:block;margin:4px 0 6px;font-size:17px}
.dcol ul{margin:0;padding-left:18px;line-height:1.25}
.dvs{align-self:center;font-family:"Luckiest Guy";font-size:22px;color:var(--brick)}
@media (max-width:480px){.diffbox{grid-template-columns:1fr}.dvs{text-align:center}}
.ra-cap{font-family:"Bangers";letter-spacing:.06em;font-size:3.6cqw;color:#7b4bb5;text-align:center}
.ra-cite{font-family:"Courier Prime";font-weight:700;font-size:3.2cqw;color:var(--ink);opacity:.75}
.ra-who{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw;width:100%}
.ra-yes,.ra-no{font-family:"Luckiest Guy";font-size:3.6cqw;letter-spacing:.03em;text-align:center;padding:1.6cqw .8cqw;border:.35cqw solid var(--ink);border-radius:1.2cqw;line-height:1.05}
.ra-yes{background:#bfe3a8;color:#1f5a26}

/* CARD LABEL LETTERING: decided by the owner 2026-10-04 (owned by Claude Code; please don't remove).
   Letters must be big, exaggerated and readable. Headline labels (number, rarity, level) are large outlined
   comic lettering that may spill past their painted bracket. Bracket labels (XP, category, set) fill their
   bracket but never shrink below a legible floor (LabelFit). Title and quote sizes come from card-typography.js. */
.t.s45.num,.t.s45.rar,.t.s45.lvl{color:#fff8e6;-webkit-text-stroke:.9cqw #171513;paint-order:stroke fill;text-shadow:.45cqw .55cqw 0 rgba(0,0,0,.5);overflow:visible;white-space:nowrap;z-index:4}
.t.s45.num{font-size:6.4cqw;letter-spacing:.04em;transform:translateY(.14em) rotate(-3deg)}
.t.s45.rar{gap:.8cqw;font-size:4.6cqw}
.t.s45.rar .gem{width:7cqw;height:7cqw;font-size:4.2cqw;-webkit-text-stroke:0;text-shadow:none}
.t.s45.rar span[style]{font-size:4.6cqw!important}
.t.s45.lvl{flex-direction:column;gap:.2cqw;font-size:4.4cqw}
.t.s45.lvl .stars{font-size:5cqw;-webkit-text-stroke:.6cqw #171513}
.t.s45.quote{font-size:5.4cqw!important;overflow:visible;-webkit-text-stroke:.8cqw #fff8e6;paint-order:stroke fill;z-index:4}   /* big; a long quote may spill past its banner */
.t.s45.cat,.t.s45.set{overflow:visible}
.t.s4.cat,.t.s4.set,.t.s5.set{-webkit-text-stroke:.55cqw #fff8e6;paint-order:stroke fill}   /* readable if it spills onto the dark frame */
.t.s5.cat{-webkit-text-stroke:.55cqw #172b4b;paint-order:stroke fill}
.t.s5.xpstrip{-webkit-text-stroke:.55cqw #fff8e6;paint-order:stroke fill}

/* Case File: the rule on lined notebook paper, with reading questions */
.casefile{--line:28px;color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:calc(var(--line) - 4px) 14px 14px 46px;
  background:linear-gradient(90deg,transparent 33px,#dc7a6e 33px,#dc7a6e 35px,transparent 35px),
    repeating-linear-gradient(#f6ecd6 0 calc(var(--line) - 1px),#a9bfd6 calc(var(--line) - 1px) var(--line));
  background-position:0 6px;font-family:"Patrick Hand";font-size:19px;line-height:var(--line)}
.casefile h4{margin:0;font-family:"Bangers";font-weight:400;letter-spacing:.06em;font-size:16px;line-height:var(--line);color:#a8321f}
.casefile .cite{font-family:"Courier Prime";font-weight:700;font-size:17px;line-height:var(--line)}
.casefile .cf-quote{margin:0 0 var(--line)}
.casefile ol{margin:0 0 var(--line);padding-left:22px}

.casefile .from{margin-bottom:var(--line)}
.casefile .readbtn{display:block;width:100%;min-height:48px;border:2px solid var(--ink);border-radius:12px;background:#f3d27a;font:inherit;color:var(--ink);cursor:pointer}
.casefile .readbtn.done{background:#cfe6c8}
