CARDS.push(
  Object.assign({}, S3, {"id": "eightback", "art": "character_eightback", "num": "★21", "l1": "EIGHT BEFORE,", "l2": "TWO BACK", "name": "Eight Before, Two Back", "intro": {"idea": "A notice of motion and its supporting papers must be served at least 8 days before the hearing. Answering papers must be served at least 2 days before it.", "example": "A motion is set to be heard on May 20. Serve the notice of motion by May 12. The other side's answering affidavits are due by May 18.", "source": "CPLR § 2214(b)"}, "emoji": "", "trickType": "clock", "rarity": "uncommon", "maxLevel": 3, "quote": "Eight days out.\nTwo days back.", "source": {"cite": "CPLR 2214(a)–(b)", "quote": "(a) A notice of motion shall specify the time and place of the hearing on the motion, the supporting papers upon which the motion is based, the relief demanded and the grounds therefor. (b) A notice of motion and supporting affidavits shall be served at least eight days before the time at which the motion is noticed to be heard. Answering affidavits shall be served at least two days before such time. Answering affidavits and any notice of cross-motion, with supporting papers, if any, shall be served at least seven days before such time if a notice of motion served at least sixteen days before such time so demands; whereupon any reply or responding affidavits shall be served at least one day before such time.", "from": "NYSenate.gov Open Legislation, checked 2026-09-28", "context": "Motion practice in a civil case: when papers must be served before the hearing date."}, "hook": "Motion papers out at least 8 days before the hearing · answering papers back at least 2 days before. Serve 16 days ahead and demand it: answers due 7 days before, replies 1 day before.", "lore": ["Every motion starts with a notice.", "Eight days is the floor, not the goal.", "Serve sixteen days early and ask, and you get your answer at seven."], "bank": [{"lv": 1, "q": "Under CPLR 2214(b), a notice of motion and supporting affidavits must be served at least how long before the hearing?", "c": ["8 days", "2 days", "30 days", "5 days"], "a": "8 days", "h": "Eight before…", "w": "\"…at least eight days before the time at which the motion is noticed to be heard.\""}, {"lv": 1, "q": "Under CPLR 2214(b), answering affidavits must be served at least:", "c": ["2 days before the hearing", "8 days before the hearing", "1 day after the hearing", "10 days before the hearing"], "a": "2 days before the hearing", "h": "…two back.", "w": "\"Answering affidavits shall be served at least two days before such time.\""}, {"lv": 1, "type": "tf", "q": "TRUE or FALSE: Under CPLR 2214(a), a notice of motion must specify the time and place of the hearing.", "c": ["True", "False"], "a": "True", "h": "Where and when?", "w": "2214(a) requires \"the time and place of the hearing on the motion.\""}, {"lv": 2, "q": "A motion is noticed to be heard on the 20th. What is the last day the notice of motion may be served?", "c": ["The 12th", "The 18th", "The 13th", "The 15th"], "a": "The 12th", "h": "Count back eight.", "w": "At least 8 days before the 20th is the 12th."}, {"lv": 2, "type": "tf", "q": "The motion is heard on the 20th, and the answering affidavits are served on the 19th. Timely under 2214(b)?", "c": ["Yes", "No"], "a": "No", "h": "Two days before.", "w": "No. Answering affidavits must be served at least 2 days before, so by the 18th."}, {"lv": 2, "q": "Which is NOT required in a notice of motion under 2214(a)?", "c": ["The judge's signature", "The relief demanded", "The grounds for the relief", "The supporting papers relied on"], "a": "The judge's signature", "h": "Four things are listed.", "w": "2214(a) lists time and place, supporting papers, relief demanded, and grounds. A judge's signature isn't one of them."}, {"lv": 3, "q": "A notice of motion is served 16 days before the hearing and demands it. When are answering affidavits and any cross-motion due?", "c": ["At least 7 days before", "At least 2 days before", "At least 8 days before", "At least 16 days before"], "a": "At least 7 days before", "h": "Sixteen buys seven.", "w": "\"…shall be served at least seven days before such time if a notice of motion served at least sixteen days before such time so demands.\""}, {"lv": 3, "q": "In that same 16-day situation, when are reply affidavits due?", "c": ["At least 1 day before", "At least 2 days before", "At least 7 days before", "On the hearing day"], "a": "At least 1 day before", "h": "The last step.", "w": "\"…whereupon any reply or responding affidavits shall be served at least one day before such time.\""}, {"lv": 3, "type": "tf", "q": "TRUE or FALSE: Serving 16 days ahead moves the answering deadline to 7 days only if the notice of motion demands it.", "c": ["True", "False"], "a": "True", "h": "\"…so demands.\"", "w": "The 7-day rule applies only \"if a notice of motion served at least sixteen days before such time so demands.\""}]}),
  Object.assign({}, S3, {"id": "reargue", "art": "character_reargue", "num": "★22", "l1": "OVERLOOKED,", "l2": "NOT NEW", "name": "Overlooked, Not New", "intro": {"idea": "A motion to reargue says the court overlooked or misunderstood facts or law it already had. No new facts, labeled as reargument, and made within 30 days after service of the order with notice of entry.", "example": "The order with notice of entry is served March 1. The lawyer thinks the court misread a statute and moves to reargue, labeled as such, by March 31, with no new facts.", "source": "CPLR § 2221(d)"}, "emoji": "", "trickType": "difference", "rarity": "uncommon", "maxLevel": 3, "quote": "You missed it.\nLook again.", "source": {"cite": "CPLR 2221(d)", "quote": "(d) A motion for leave to reargue: 1. shall be identified specifically as such; 2. shall be based upon matters of fact or law allegedly overlooked or misapprehended by the court in determining the prior motion, but shall not include any matters of fact not offered on the prior motion; and 3. shall be made within thirty days after service of a copy of the order determining the prior motion and written notice of its entry. This rule shall not apply to motions to reargue a decision made by the appellate division or the court of appeals.", "from": "NYSenate.gov Open Legislation, checked 2026-09-28", "context": "Asking the court to look again at a motion it already decided."}, "hook": "REARGUE = the court OVERLOOKED or MISUNDERSTOOD the facts or law · NO new facts · within 30 DAYS of service of the order with notice of entry · label it \"reargue.\" (New facts? That's RENEW, ★23.)", "lore": ["Same facts. Sharper argument.", "No new evidence at the door.", "Thirty days from notice of entry, not from the ruling."], "bank": [{"lv": 1, "q": "A motion for leave to reargue under 2221(d) is based on:", "c": ["Facts or law the court overlooked or misapprehended", "New facts found after the motion", "A change of judge", "The other side's consent"], "a": "Facts or law the court overlooked or misapprehended", "h": "What did the court miss?", "w": "\"…based upon matters of fact or law allegedly overlooked or misapprehended by the court…\""}, {"lv": 1, "type": "tf", "q": "TRUE or FALSE: A motion to reargue may include facts that were not offered on the prior motion.", "c": ["True", "False"], "a": "False", "h": "Not new.", "w": "It \"shall not include any matters of fact not offered on the prior motion.\""}, {"lv": 1, "q": "A motion to reargue must be made within how many days after service of the order with written notice of its entry?", "c": ["30 days", "10 days", "60 days", "120 days"], "a": "30 days", "h": "A month.", "w": "\"…within thirty days after service of a copy of the order … and written notice of its entry.\""}, {"lv": 2, "q": "A party thinks the judge misread a key contract clause. There's no new evidence. Which motion fits?", "c": ["Reargue", "Renew", "Summary judgment", "Notice of appeal"], "a": "Reargue", "h": "Same facts, overlooked.", "w": "The court misapprehended the facts or law, with nothing new, so reargue."}, {"lv": 2, "type": "tf", "q": "The order with notice of entry was served March 1. A motion to reargue made April 15 is:", "c": ["Timely", "Late"], "a": "Late", "h": "Count 30 days.", "w": "Late. It had to be made within 30 days of service, by about March 31."}, {"lv": 2, "q": "Under 2221(d)(1), a motion to reargue must:", "c": ["Be identified specifically as such", "Be signed by the judge", "Be filed with the appellate division", "Include new affidavits"], "a": "Be identified specifically as such", "h": "Label it.", "w": "\"shall be identified specifically as such.\""}, {"lv": 3, "type": "tf", "q": "TRUE or FALSE: The 2221(d) 30-day rule applies to a motion to reargue an Appellate Division decision.", "c": ["True", "False"], "a": "False", "h": "Read the last sentence.", "w": "\"This rule shall not apply to motions to reargue a decision made by the appellate division or the court of appeals.\""}, {"lv": 3, "q": "A motion to reargue relies on a witness statement never shown to the court before. What's wrong with it?", "c": ["It adds facts not offered on the prior motion", "It was made too early", "Only the judge can make it", "It needs a jury"], "a": "It adds facts not offered on the prior motion", "h": "Overlooked, not new.", "w": "Reargument can't include \"any matters of fact not offered on the prior motion.\" New facts belong in a motion to renew."}, {"lv": 3, "q": "The 30-day reargument clock starts with:", "c": ["Service of the order with written notice of entry", "The judge signing the order", "The hearing date", "The note of issue"], "a": "Service of the order with written notice of entry", "h": "Service plus notice.", "w": "\"…thirty days after service of a copy of the order … and written notice of its entry.\""}]}),
  Object.assign({}, S3, {"id": "renew", "art": "character_renew", "num": "★23", "l1": "NEW FACTS,", "l2": "GOOD EXCUSE", "name": "New Facts, Good Excuse", "intro": {"idea": "A motion to renew rests on new facts (or a change in the law) that would change the result, plus a reasonable excuse for not offering those facts before. It must be labeled as renewal.", "example": "After losing a motion, a party finds a signed contract that would change the decision. They move to renew and explain why they could not present it the first time.", "source": "CPLR § 2221(e)"}, "emoji": "", "trickType": "difference", "rarity": "uncommon", "maxLevel": 3, "quote": "Found something new.\nHere's why it's late.", "source": {"cite": "CPLR 2221(e)", "quote": "(e) A motion for leave to renew: 1. shall be identified specifically as such; 2. shall be based upon new facts not offered on the prior motion that would change the prior determination or shall demonstrate that there has been a change in the law that would change the prior determination; and 3. shall contain reasonable justification for the failure to present such facts on the prior motion.", "from": "NYSenate.gov Open Legislation, checked 2026-09-28", "context": "Bringing new facts or a change in the law back to the court that decided a motion."}, "hook": "RENEW = NEW FACTS that would change the result, or a CHANGE IN THE LAW · plus a REASONABLE JUSTIFICATION for not raising the facts before · label it \"renew.\" (No new facts? That's REARGUE, ★22.)", "lore": ["New facts open the door.", "A change in the law does too.", "But you owe the court a reason."], "bank": [{"lv": 1, "q": "A motion for leave to renew under 2221(e) is based on:", "c": ["New facts not offered on the prior motion", "Facts the court overlooked", "The judge's opinion", "A typo in the order"], "a": "New facts not offered on the prior motion", "h": "Something new.", "w": "\"…based upon new facts not offered on the prior motion that would change the prior determination…\""}, {"lv": 1, "type": "tf", "q": "TRUE or FALSE: A change in the law that would change the prior determination can support a motion to renew.", "c": ["True", "False"], "a": "True", "h": "Two roads to renew.", "w": "It may \"demonstrate that there has been a change in the law that would change the prior determination.\""}, {"lv": 1, "q": "Along with the new facts, a motion to renew must contain:", "c": ["A reasonable justification for not presenting them before", "A filing fee", "The other side's signature", "A jury demand"], "a": "A reasonable justification for not presenting them before", "h": "Why so late?", "w": "\"…shall contain reasonable justification for the failure to present such facts on the prior motion.\""}, {"lv": 2, "q": "After a motion is decided, a party finds a document that would change the result. They didn't have it earlier because the other side withheld it. Which motion fits?", "c": ["Renew", "Reargue", "Restraining notice", "Summary judgment"], "a": "Renew", "h": "New facts plus a reason.", "w": "New facts that would change the result, with a reasonable justification, is renewal."}, {"lv": 2, "type": "tf", "q": "TRUE or FALSE: New facts that would NOT change the prior determination are enough for renewal.", "c": ["True", "False"], "a": "False", "h": "They have to matter.", "w": "The new facts must be ones \"that would change the prior determination.\""}, {"lv": 2, "q": "Reargue or renew: which one allows new facts?", "c": ["Renew only", "Reargue only", "Both", "Neither"], "a": "Renew only", "h": "Overlooked, not new.", "w": "Reargument \"shall not include any matters of fact not offered,\" but renewal is \"based upon new facts.\""}, {"lv": 3, "q": "A party moves to renew with new facts but gives no reason they weren't raised earlier. What's missing under 2221(e)(3)?", "c": ["A reasonable justification", "A notice of entry", "A clerk's stamp", "A jury trial"], "a": "A reasonable justification", "h": "The \"good excuse.\"", "w": "The motion \"shall contain reasonable justification for the failure to present such facts on the prior motion.\""}, {"lv": 3, "type": "tf", "q": "TRUE or FALSE: Under 2221(e)(1), a motion to renew must be identified specifically as such.", "c": ["True", "False"], "a": "True", "h": "Same as reargue.", "w": "\"shall be identified specifically as such.\""}, {"lv": 3, "q": "A higher court changes the law in a way that would change a prior ruling in your case. Which motion brings that to the court that ruled?", "c": ["Renew", "Reargue", "Notice of appeal", "Restraining notice"], "a": "Renew", "h": "Change in the law.", "w": "Renewal may \"demonstrate that there has been a change in the law that would change the prior determination.\""}]}),
  Object.assign({}, S3, {"id": "sj120", "art": "character_sj120", "num": "★24", "l1": "120 DAYS", "l2": "AFTER THE NOTE", "name": "120 Days After the Note", "intro": {"idea": "Any party may move for summary judgment after issue is joined. If the court sets no other date, the motion is due no later than 120 days after the note of issue is filed.", "example": "The note of issue is filed January 10 and the court set no date. A summary judgment motion must be made by May 10. After that, only with leave of court on good cause.", "source": "CPLR § 3212(a)"}, "emoji": "", "trickType": "clock", "rarity": "rare", "maxLevel": 5, "quote": "Note filed.\nClock's running.", "source": {"cite": "CPLR 3212(a)–(b)", "quote": "(a) Any party may move for summary judgment in any action, after issue has been joined; provided however, that the court may set a date after which no such motion may be made, such date being no earlier than thirty days after the filing of the note of issue. If no such date is set by the court, such motion shall be made no later than one hundred twenty days after the filing of the note of issue, except with leave of court on good cause shown. (b) A motion for summary judgment shall be supported by affidavit, by a copy of the pleadings and by other available proof, such as depositions and written admissions. The affidavit shall be by a person having knowledge of the facts … The motion shall be granted if, upon all the papers and proof submitted, the cause of action or defense shall be established sufficiently to warrant the court as a matter of law in directing judgment in favor of any party. … the motion shall be denied if any party shall show facts sufficient to require a trial of any issue of fact. If it shall appear that any party other than the moving party is entitled to a summary judgment, the court may grant such judgment without the necessity of a cross-motion.", "from": "NYSenate.gov Open Legislation, checked 2026-09-28", "context": "Asking the court to decide a case without a trial."}, "hook": "SUMMARY JUDGMENT: any party, AFTER ISSUE IS JOINED · deadline = 120 DAYS after the NOTE OF ISSUE is filed, unless the court sets its own date (never earlier than 30 days after) · late only with LEAVE OF COURT on GOOD CAUSE.", "lore": ["No trial needed if nothing is truly in dispute.", "The note of issue starts the clock.", "Late? Only with good cause.", "A judge can set an earlier cutoff.", "But never sooner than thirty days."], "bank": [{"lv": 1, "q": "If the court sets no date, a summary judgment motion must be made no later than:", "c": ["120 days after the note of issue is filed", "30 days after issue is joined", "1 year after the summons", "8 days before trial"], "a": "120 days after the note of issue is filed", "h": "Look at the name.", "w": "\"…no later than one hundred twenty days after the filing of the note of issue…\""}, {"lv": 1, "q": "A party may move for summary judgment:", "c": ["After issue has been joined", "Before the summons is served", "Only after trial", "Only if the jury agrees"], "a": "After issue has been joined", "h": "Once the case is at issue.", "w": "\"…after issue has been joined…\""}, {"lv": 1, "type": "tf", "q": "TRUE or FALSE: Only the plaintiff may move for summary judgment.", "c": ["True", "False"], "a": "False", "h": "\"Any party…\"", "w": "\"Any party may move for summary judgment in any action…\""}, {"lv": 2, "q": "The note of issue was filed January 10, and the court set no deadline. The summary judgment deadline is:", "c": ["120 days after January 10", "30 days after January 10", "8 days before trial", "One year after January 10"], "a": "120 days after January 10", "h": "The default clock.", "w": "With no court-set date, it's 120 days after the note of issue is filed."}, {"lv": 2, "type": "tf", "q": "TRUE or FALSE: A court may set its own summary judgment cutoff 15 days after the note of issue.", "c": ["True", "False"], "a": "False", "h": "There's a minimum.", "w": "A court-set date m const DAY = 864e5;

const frostProgressFor = (age, deadline) => {
  if (!Number.isFinite(age) || !Number.isFinite(deadline) || age < 0 || deadline <= 0) return 0;
  const smooth = n => { n = Math.max(0, Math.min(1, n)); return n*n*(3-2*n); };
  const start = deadline * .45;
  if (age <= start) return 0;
  if (age <= deadline) return .88 * smooth((age - start) / (deadline - start));
  return Math.min(1, .88 + .12 * smooth((age - deadline) / DAY));

};

/* ================= ART LOOKUP =================
   Drop files named art/<card>_<level>.webp (or .jpg/.webp) into the art folder.
   The card uses the highest stage it has; missing stages get sticker jokes on top. */
const ART = {};
function probeArt(){
  // The published build lists its art files up front, so nothing has to be guessed.
  if (window.ART_MANIFEST) { CARDS.forEach(c => { ART[c.id] = window.ART_MANIFEST[c.art] || {}; }); return Promise.resolve(); }
  const jobs = [];
  CARDS.forEach(c => {
    ART[c.id] = {};
    if (c.asset) jobs.push(new Promise(res => {
      const img = new Image(); const done = () => res();
      img.onload = () => { ART[c.id][1] = c.asset; done(); };
      img.onerror = done; setTimeout(done, 2500); img.src = c.asset;
    }));
    const levels = c.series === 3 ? [1] : [1,2,3,4,5];
    for (const l of levels) for (const ext of ['png','jpg','webp']) {
      jobs.push(new Promise(res => {
        const img = new Image(); const done = () => res();
        img.onload = () => { if (!ART[c.id][l]) ART[c.id][l] = `art/${c.art}_${l}.${ext}`; done(); };
        img.onerror = done; setTimeout(done, 2500);
        img.src = `art/${c.art}_${l}.${ext}`;
      }));
    }
  });
  return Promise.all(jobs);
}

/* The bracket labels (XP, category, card set) are grown to the largest size that fits their painted bracket,
   but never below a legible floor: --fit multiplies their font sizes. Headline labels are sized in CSS.
   Sizes are in cqw, so one measurement on a hidden 300px card holds at every card size; results are cached
   by series + label + text. Runs as cards are added, before they paint. */
const LabelFit = (() => {
  const SEL = '.t.meta.s45.xpstrip, .t.meta.s45.cat, .t.meta.s45.set', FLOOR = 3.6, MAX = 2.4, cache = new Map();   // FLOOR: smallest legible size, in cqw

  const fits = el => { range.selectNodeContents(el); const r = range.getBoundingClientRect();

    const els = root.matches && root.matches(SEL) ? [root] : root.querySelectorAll ? root.querySelectorAll(SEL) : [];

      const card = el.closest('.card'); if (!card) return;
      const series = (card.className.match(/\bseries\d\b/) || ['series1'])[0];
      const key = series + '|' + el.className + '|' + el.textContent;

const FrostClock = (() => {

function mutate(s, lv){
  const ops = [];

  const digits = [...s].map((ch,i)=>/\d/.test(ch)?i:-1).filter(i=>i>=0);

    const i = pick(letters); const ch = s[i], low = ch.toLowerCase();
    let r = lv<=2 ? pick('abcdefghijklmnoprstuvwy'.split('').filter(x=>x!==low)) : (LOOKALIKE[low] || 'e');
    if (ch !== low) r = r.toUpperCase();
    return s.slice(0,i) + r + s.slice(i+1);
  });
  if (digits.length && lv>=2) ops.push(() => { const i = pick(digits); return s.slice(0,i) + (lv<=2 ? String((+s[i]+1+rnd(8))%10) : DIGITALIKE[s[i]]) + s.slice(i+1); });

    const pairs = [];
    for (let i=0;i<s.length-1;i++) if (/\d/.test(s[i]) && /\d/.test(s[i+1]) && s[i]!==s[i+1]) pairs.push(i);
    if (pairs.length) ops.push(() => { const i = pick(pairs); return s.slice(0,i) + s[i+1] + s[i] + s.slice(i+2); });
    const m = s.match(/ ([A-Z])\. /g);
    if (m && m.length > 1) ops.push(() => s.replace(/ ([A-Z])\. (\d)/, (_, L, d) => ` ${L==='M'?'N':'M'}. ${d}`));

    if (dbl > 0) ops.push(() => s.slice(0,dbl) + s.slice(dbl+1));
    const lp = [];
    for (let i=1;i<s.length-1;i++) if (/[a-z]/.test(s[i]) && /[a-z]/.test(s[i+1]) && s[i]!==s[i+1]) lp.push(i);
    if (lp.length) ops.push(() => { const i = pick(lp); return s.slice(0,i) + s[i+1] + s[i] + s.slice(i+2); });

function genCompare(lv){

    return `${last}, ${first[0]}. ${mi}. ${num}`;

    if (lv === 1) {

      if (!names.some(y => y.last[0]===last[0])) add({last, first:pick(FIRSTS)});
    } else if (lv === 2) {

    } else if (lv === 3) {

    h:'Last name first. Tie? Then first name, then middle initial.', w:why, raw:true };

  if (idea) { const first = (idea.match(/^.*?[.!?](\s|$)/) || [idea])[0].trim(); return first.length > 110 ? first.slice(0, 107).replace(/\s+\S*$/, '') + '…' : first; }
  return `${titleCase(c.set)} · ${titleCase(c.category)}`;
}
const heroTopicTitle = c => titleCase(c.set || c.category || 'Court Clerk Practice');
function statusLine(c){
  const st = S.cards[c.id];
  if (!st.owned) return 'Find it in packs';
  if (isCold(st)) return ICO('thermo_snow') + ' Cold case · reopen for +' + COLD_BONUS + ' XP';
  if (st.mastered) return ICO('mastered') + ' Mastered';
  return `Level ${st.level} · ${NEED[st.level-1] - st.xp} XP to ${st.level < maxL(c) ? 'Level ' + (st.level + 1) : 'Mastered'}`;
}
function cardRow(c, act){
  const st = S.cards[c.id];

function miniCard(c, cls = ''){

function seg(key, value, options){
  return `<div class="seg" role="tablist">${options.map(([v, label]) => `<button role="tab" class="${v === value ? 'on' : ''}" data-act="seg" data-k="${key}" data-v="${v}">${label}</button>`).join('')}</div>`;

/* ---------- groups: series and subjects ---------- */
const SERIES = [
  {g:'all', label:'All Cards', icon:'cards'},
  {g:'s1', label:'Series 1', icon:'series1'},
  {g:'s2', label:'Series 2', icon:'series2'},
  {g:'s3', label:'Series 3', icon:'series3'},
  {g:'s4', label:'Series 4', icon:'cards'},
  {g:'s5', label:'Series 5', icon:'cards'},
  {g:'tricks', label:'All Memory Tricks', icon:'memory'},
];
function groupTest(g){
  if (g.startsWith('set:')) { const n = g.slice(4); return c => c.set === n; }
  return ({all:() => true, s1:c => !c.series && !c.trickType, s2:c => c.series === 2, s3:c => c.series === 3,
    s4:c => c.series === 4, s5:c => c.series === 5, tricks:c => !!c.trickType})[g] || (() => true);
}
function groupLabel(g){
  if (g.startsWith('set:')) return titleCase(g.slice(4));
  return (SERIES.find(x => x.g === g) || {}).label || 'Cards';
}
/* Hand-drawn UI icons (art/icon_*.webp). The build rewrites these paths to .webp. */
const ICO = (name, cls = '') => `<img class="ico ${cls}" src="art/icon_${name}.webp" alt="">`;
const artSrc = name => `art/${name}.webp`;
const stickerArtSrc = id => ['summons','motion'].includes(id) ? artSrc('character_' + id + '_1') : artSrc('sticker_' + id);
/* Pack art follows the newest series inside: Series 3, then Series 2, then the original pack */
const packArtFor = cards => { const series = Math.max(1, ...cards.map(c => c && Number(c.series) || 1)); return artSrc(series === 1 ? 'pack' : `pack_s${series}`); };
const nextPackArt = () => nextPackArtSrc();   // the wrapper of the series the next free pack comes from
const hintCosts = () => !!(sess && sess.hint && !sess.freeHint);   // a free-hint boost makes the hint cost nothing
const backSrc = () => (S.styles && S.styles.back) ? artSrc('back_' + S.styles.back) : 'art/cardback.webp';   // the card back in use
/* A card's equipped style: a bought frame (Series 1/2 only) and holo foil. */
const styleFrame = c => { const e = S.styles && S.styles.cards[c.id] && S.styles.cards[c.id].eq; return e && e.frame && ![3,4,5].includes(c.series) ? artSrc('frame_' + e.frame) : ''; };
const holoHTML = c => { const e = S.styles && S.styles.cards[c.id] && S.styles.cards[c.id].eq; return e && e.foil ? `<div class="holo" style="background-image:url(${artSrc('foil_texture')})"></div><div class="foil"></div>` : ''; };
const COIN = `<img class="ico coin" src="art/icon_coin.webp" alt="coins">`;
const titleCase = s => s.toLowerCase().replace(/(^|[\s:&(])([a-z])/g, (m, a, b) => a + b.toUpperCase()).replace(/\bCplr\b/, 'CPLR').replace(/\bAct\b/, 'Act');
function subjects(){ return [...new Set(CARDS.map(c => c.set))].map(set => ({g:'set:' + set, label:titleCase(set)})); }
function groupRow(g, label, icon, act = 'cards'){
  const list = CARDS.filter(groupTest(g)), have = list.filter(owned).length;
  return `<button class="row" data-act="push" data-s="${act}" data-g="${esc(g)}">
    <span class="th emo gi">${ICO(icon)}</span><span class="row-main"><b>${esc(label)}</b><small>${have} of ${list.length} collected</small>${pbar(have / Math.max(1, list.length))}</span>${chev}</button>`;
}

/* ---------- daily quests + milestones (every reward is a card pack) ---------- */
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function daily(){
  if (!S.daily || S.daily.date !== todayKey()) S.daily = { date:todayKey(), sessions:0, correct:0, trick:0, claimed:{} };
  return S.daily;
}
const DAILY_QUESTS = [
  {id:'round', icon:'play', label:'Finish a study round', need:1, get:d => d.sessions},
  {id:'correct', icon:'check', label:'Get 10 answers right', need:10, get:d => d.correct},
  {id:'trick', icon:'memory', label:'Get 3 Memory Trick answers right', need:3, get:d => d.trick},
];
const ownedCount = () => CARDS.filter(owned).length, masteredCount = () => CARDS.filter(c => S.cards[c.id].mastered).length;
const MILESTONES = [
  {id:'col5', icon:'cards', label:'Collect 5 cards', need:5, get:ownedCount},
  {id:'col15', icon:'cards', label:'Collect 15 cards', need:15, get:ownedCount},
  {id:'col25', icon:'cards', label:'Collect 25 cards', need:25, get:ownedCount},
  {id:'colall', icon:'crown', label:'Collect every card', need:() => CARDS.length, get:ownedCount},
  {id:'master1', icon:'mastered', label:'Master a card', need:1, get:masteredCount},
  {id:'master5', icon:'mastered', label:'Master 5 cards', need:5, get:masteredCount},
  {id:'rounds5', icon:'play', label:'Finish 5 study rounds', need:5, get:() => S.stats.sessions},
  {id:'rounds25', icon:'play', label:'Finish 25 study rounds', need:25, get:() => S.stats.sessions},
  {id:'reopen', icon:'thermo_snow', label:'Reopen a cold case', need:1, get:() => S.stats.reopened || 0},
  {id:'packs10', icon:'pack', label:'Open 10 packs', need:10, get:() => S.packsOpened},
];
const qNeed = q => typeof q.need === 'function' ? q.need() : q.need;
function questState(q, kind){
  const val = kind === 'daily' ? q.get(daily()) : q.get(), need = qNeed(q);
  const claimed = kind === 'daily' ? !!daily().claimed[q.id] : !!(S.milestones || {})[q.id];
  return { val:Math.min(val, need), need, done:val >= need, claimed };
}
const readyList = () => DAILY_QUESTS.filter(q => { const x = questState(q, 'daily'); return x.done && !x.claimed; }).map(q => ['daily', q])
  .concat(MILESTONES.filter(q => { const x = questState(q, 'mile'); return x.done && !x.claimed; }).map(q => ['mile', q]));
const claimableCount = () => readyList().length;
function questRow(q, kind){
  const x = questState(q, kind);
  const btn = x.claimed ? `<span class="q-done">✓</span>`
    : x.done ? `<button class="q-claim" data-act="claim" data-kind="${kind}" data-q="${q.id}">Claim</button>`
    : `<span class="q-reward">${ICO('pack')} +1</span>`;
  return `<div class="row q ${x.claimed ? 'claimed' : ''} ${x.done && !x.claimed ? 'ready' : ''}"><span class="th emo gi">${ICO(q.icon)}</span>
    <span class="row-main"><b>${esc(q.label)}</b><small>${x.claimed ? 'Claimed' : x.val + ' / ' + x.need}</small>${x.claimed ? '' : pbar(x.val / x.need)}</span>${btn}</div>`;
}
function claimQuest(kind, id){
  const q = (kind === 'daily' ? DAILY_QUESTS : MILESTONES).find(x => x.id === id); if (!q) return;
  const x = questState(q, kind); if (!x.done || x.claimed) return;
  if (kind === 'daily') { daily().claimed[id] = true; onbFlag('claimed'); } else { S.milestones = S.milestones || {}; S.milestones[id] = true; }
  const coins = kind === 'daily' ? earnCoins(COINS.dailyQuest, `Daily quest: ${q.label}`) : 0;
  S.packs++; save(); nativeFeedback('claim'); refresh();
  openSheet(`<div class="reward"><img src="art/pack.webp" alt="" class="bob"><h3>Quest complete!</h3><p>${esc(q.label)}</p><b>+1 card pack${coins ? ` · +${coins} ${COIN}` : ''}</b></div>
    <button class="btn-big gold" data-act="pack-open">${ICO('pack')} OPEN IT NOW</button><button class="sheet-cancel" data-act="sheet-close">Later</button>`);
}
function toast(msg, icon){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  if (icon) t.insertAdjacentHTML('afterbegin', ICO(icon));
  document.body.appendChild(t); setTimeout(() => t.classList.add('out'), 1600); setTimeout(() => t.remove(), 2000);
}

const nav = { tab:'home', stacks:{} };

const topEntry = () => { const st = nav.stacks[nav.tab]; return st[st.length - 1]; };

function currentScreenEl(){ return document.querySelector('#screens .screen.current'); }
function saveScroll(){ const el = currentScreenEl(); if (el && el._entry) el._entry.scroll = el.querySelector('.scr').scrollTop; }
function buildScreen(entry, depth = nav.stacks[nav.tab].length - 1){
  const def = SCREENS[entry.s](entry.p || {});
  const root = depth === 0;
  const el = document.createElement('section');
  el.className = 'screen' + (def.hideLarge && !def.titleOnScroll ? ' nolarge' : '') + (def.cta ? ' has-cta' : '');
  el.innerHTML = `<header class="navbar ${def.homebar ? 'homebar' : ''}"><div class="nb-left">${root ? coinChip() : `<button class="nb-back" data-act="back">${'<svg viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'}<span>${esc(backLabel(depth))}</span></button>`}</div>
    <div class="nb-title">${def.navTitle || esc(def.title)}</div><div class="nb-right">${def.right || ''}</div></header>
    <div class="scr">${def.hideLarge ? '' : `<h1 class="large-title">${esc(def.title)}</h1>`}${def.body}</div>${def.after || ''}`;
  el._entry = entry;
  const scr = el.querySelector('.scr');
  scr.addEventListener('scroll', () => el.classList.toggle('scrolled', scr.scrollTop > 28), {passive:true});
  return el;
}
function backLabel(depth = nav.stacks[nav.tab].length - 1){
  const st = nav.stacks[nav.tab]; if (depth < 1) return '';
  const prev = st[depth - 1];
  try { const t = SCREENS[prev.s](prev.p || {}).title; return t.length > 12 ? 'Back' : t; } catch(e){ return 'Back'; }
}
function showScreen(dir = 'none'){
  const box = document.getElementById('screens');
  const old = currentScreenEl();
  const el = buildScreen(topEntry());
  box.appendChild(el); el.classList.add('current');
  const scr = el.querySelector('.scr'); scr.scrollTop = topEntry().scroll || 0; el.classList.toggle('scrolled', scr.scrollTop > 28);
  const nbBack = el.querySelector('.nb-back'), nbTitle = el.querySelector('.nb-title');
  if (nbBack && nbBack.getBoundingClientRect().right > nbTitle.getBoundingClientRect().left) el.querySelector('.navbar').classList.add('tight');
  if (old) old.classList.remove('current');
  const reduce = prefersReducedMotion();
  if (old && dir !== 'none' && !reduce && el.animate) {
    const ease = 'cubic-bezier(.2,.8,.2,1)', dur = 260;
    if (dir === 'push') {
      el.animate([{transform:'translateX(100%)'}, {transform:'none'}], {duration:dur, easing:ease});
      old.animate([{transform:'none', filter:'brightness(1)'}, {transform:'translateX(-28%)', filter:'brightness(.7)'}], {duration:dur, easing:ease}).finished.then(() => old.remove(), () => old.remove());
    } else {
      old.style.zIndex = 2;
      el.animate([{transform:'translateX(-28%)', filter:'brightness(.7)'}, {transform:'none', filter:'brightness(1)'}], {duration:dur, easing:ease});
      old.animate([{transform:'none'}, {transform:'translateX(100%)'}], {duration:dur, easing:ease}).finished.then(() => old.remove(), () => old.remove());
    }
  } else if (old) old.remove();
  renderTabbar();
}
function push(s, p = {}){ saveScroll(); nav.stacks[nav.tab].push({s, p}); history.pushState({cq:'push'}, ''); showScreen('push'); }
function pop(){ const st = nav.stacks[nav.tab]; if (st.length > 1) { st.pop(); showScreen('pop'); return true; } return false; }
function switchTab(id){
  if (id === nav.tab) {                                // tapping the active tab: pop to its root, or scroll to top
    const st = nav.stacks[id];
    if (st.length > 1) { st.length = 1; showScreen('pop'); }
    else { const s = currentScreenEl() && currentScreenEl().querySelector('.scr'); s && s.scrollTo({top:0, behavior:'smooth'}); }
    return;
  }
  saveScroll(); nav.tab = id; showScreen('none');
}
function refresh(){ saveScroll(); showScreen('none'); }   // re-render the current screen in place (keeps scroll)

/* ---- study session ---- */
function startSession(id, lesson){
  if (lesson) {
    const queue = (Array.isArray(lesson.queue) ? lesson.queue : []).filter(canStudyCard);
    if (!queue.length) { missingSheet(id); return false; }
    lesson = { ...lesson, queue }; id = queue[0];
  }
  const c = byId(id);
  if (!owned(c)) { missingSheet(id); return false; }
  if (typeof guestWallDue === 'function' && guestWallDue()) { guestWall(); return; }   // a guest signs up before a second round
  openSessionLayer();
  sess = { id, i:0, results:[], xp:0, used:new Set(), startLevel:S.cards[id].level, startXP:S.cards[id].xp, wasCold:isCold(S.cards[id]), reopened:false, lesson:lesson || null };
  if (sess.wasCold) tipOnce('cold');
  sess.q = nextQuestion(c, S.cards[id].level, sess.used);
  sess.hint = false; sess.freeHint = false; sess.answered = null;
  view = { name:'study' };
  const st = S.cards[id];
  app.innerHTML = `
    <div class="topbar"><button class="x" data-act="session-close" aria-label="Close">✕</button><div class="dots" id="dots"></div><button class="x help" data-act="study-help" data-id="${id}" aria-label="Study help">${ICO('read')}</button><span class="chip ${doubleXPOn() ? 'dbl' : ''}" id="sxp">+0 XP</span></div>
    <div class="stage" id="stage"><div class="lifter"><div class="flip" id="flip">
      <div class="face front">${cardEl(c, st)}</div>
      <div class="face back"><div class="card" id="back"></div></div>
    </div></div><div class="stage-shadow"></div></div>
    <div class="below" id="below"></div>`;
  paintStudy();
  setTimeout(() => {
    const stage = document.getElementById('stage'), flip = document.getElementById('flip');
    if (!stage || !flip) return;
    stage.classList.add('flipping'); flip.classList.add('flipped');
    setTimeout(() => stage.classList.remove('flipping'), 760);
  }, 650);
}
/* Shrink a box's text (in cqw) until it fits, but never below a readable minimum. */
function shrinkToFit(el, minCqw){
  if (!el || !el.clientHeight) return;
  let fs = parseFloat(el.style.fontSize) || parseFloat(getComputedStyle(el).fontSize) / (el.closest('.card').clientWidth / 100);
  for (let i = 0; i < 24 && el.scrollHeight > el.clientHeight + 2 && fs > minCqw; i++) { fs = Math.max(minCqw, fs - .2); el.style.fontSize = fs.toFixed(2) + 'cqw'; }
}

        const afs = o.length > 22 ? 4 : o.length > 16 ? 4.3 : 5;   // never smaller; longer text opens the full-text sheet
        const wrap = o.length > 22 ? 'wrap' : '';
        return `<button class="ans ${cls}" style="${PB(86,ys[i],632,ys[i]+126)}" data-act="answer" data-v="${esc(o)}" ${ans?'disabled':''} aria-label="${letters[i]}: ${esc(o)}">

/* ---- Readiness: what you actually remember, kept apart from XP ----
   Each card has a recall box 0-5. A right answer without a hint moves it up one (once a day per card, so
   cramming can't max it out); a hinted right answer changes nothing; a wrong answer moves it down one.
   Each box has a review gap; after the gap, the card's strength fades. XP, boosts, coins and prizes never
   touch it. Exam readiness = average strength over cards that have real questions (generated skill games
   don't count), owned or not. Stored in S.recall[cardId] = {box, due, last, up, right, wrong}. */
const Recall = (() => {
  const DAYMS = 864e5, GAP = [0, 1, 3, 7, 14, 30];   // days until review, by box
  const all = () => (S.recall = S.recall && typeof S.recall === 'object' ? S.recall : {});
  const rec = id => all()[id] || { box:0, due:0, last:0, up:0, right:0, wrong:0 };
  function record(id, ok, hinted){
    const r = { ...rec(id) }, now = Date.now();
    if (ok) { r.right++; if (!hinted && now - r.up > 20 * 36e5) { r.box = Math.min(5, r.box + 1); r.up = now; } }
    else { r.wrong++; r.box = Math.max(0, r.box - 1); }

    const r = rec(id); if (!r.box) return 0;
    const over = Math.max(0, now - r.due) / (GAP[r.box] * DAYMS);

  function dueText(id){
    const r = rec(id); if (!r.box) return r.wrong || r.right ? 'Keep practicing to build recall' : 'Not studied yet';
    const d = Math.ceil((r.due - Date.now()) / DAYMS);
    return d <= 0 ? 'Review due now' : d === 1 ? 'Review due tomorrow' : `Review due in ${d} days`;
  }
  // five dots, filled to the card's current (faded) strength
  const pips = id => { const n = Math.round(strength(id) * 5); return `<span class="rc-pips" aria-label="Recall ${n} of 5">${[1,2,3,4,5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`; };

/* ---- card packs ---- */
/* Pack odds (see docs/superpowers/specs/2026-09-30-economy-design.md): the first few packs always hold a new card,
   after that it is chance, and rarer cards turn up less often. All numbers here are starting values to tune. */
const GUARANTEE_PACKS = 5;
const RARITY_WEIGHT = { common:1, uncommon:.5, rare:.15, epic:.08, legendary:.04 };
const pickByRarity = pool => {   // one card from pool, rarer cards less likely
  const w = pool.map(c => RARITY_WEIGHT[c.rarity] ?? .5);
  let r = Math.random() * w.reduce((x, y) => x + y, 0), i = 0;
  while (i < pool.length - 1 && (r -= w[i]) > 0) i++;
  return pool[i];
};
/* Which series the next free pack comes from: the earliest series you have not finished (Series 1 first). */
function nextPackSeries(){
  for (const d of SERIES_DEFS) if (CARDS.filter(d.test).some(c => !S.cards[c.id].owned)) return d.n;
  return SERIES_DEFS[SERIES_DEFS.length - 1].n;
}
const nextPackArtSrc = () => seriesPackArt(nextPackSeries());
/* A pack draws only from the series on its wrapper. The 12 trick cards that belong to no series are sprinkled into every pack. */
function drawPack(n = nextPackSeries()){
  const d = seriesDef(n), owned = c => S.cards[c.id].owned;
  const pool = CARDS.filter(d.test), tricks = CARDS.filter(c => c.trickType && !c.series);
  const picks = []; const take = c => { if (c && picks.length < 3 && !picks.includes(c)) picks.push(c); };
  const fits = c => c && !owned(c) && (d.test(c) || (c.trickType && !c.series));   // promises from older saves count only if the card belongs in this pack
  const promised = [].concat(S.guarantee || []).filter(id => fits(byId(id)));
  if (promised.length) { promised.slice(0, 3).forEach(id => take(byId(id)));
    const left = [].concat(S.guarantee || []).filter(id => !picks.some(c => c.id === id)); S.guarantee = left.length ? left : null; }
  else if (S.packsOpened === 0 && tricks.some(c => !owned(c))) take(shuffle(tricks.filter(c => !owned(c)))[0]);   // the first pack shows a Memory Trick
  else if (Math.random() < .34) take(shuffle(tricks.filter(c => !owned(c)))[0] || pickByRarity(tricks));          // about 1 pack in 3 carries a trick card
  if (S.packsOpened < GUARANTEE_PACKS) take(shuffle(pool.filter(c => !owned(c) && !picks.includes(c)))[0] || shuffle(tricks.filter(c => !owned(c) && !picks.includes(c)))[0]);   // early packs hold something new
  let guard = 0;
  while (picks.length < 3 && guard++ < 60) take(pickByRarity(pool.filter(c => !picks.includes(c))));
  const out = resolvePulls(picks); out.series = d.n; return out;
}
/* Picked cards → new cards join the collection, duplicates pay coins */
function resolvePulls(picks){
  return shuffle(picks).map(c => {
    const st = S.cards[c.id], isNew = !st.owned; let coins = 0;
    if (isNew) st.owned = true; else coins = earnCoins(coinsForDup(c), `Duplicate: ${c.name}`);
    return { c, isNew, coins, st:{...st} };

}
/* Swipe to rip: a ragged tear line across the top of the pack. The torn part of the flap peels up under your finger. */
const TEAR_Y = 12;   // % down the pack, just under the crimp

function flapClip(line, a, b){   // the wrapper above the tear line, from x = a to x = b (%)

  flap.style.transformOrigin = `${hinge}% ${yAt(line, hinge)}%`;

/* Read-first intro: one idea, one example, one source label, then the round. "Go straight to questions" skips it next time
   (it stays readable from the card's menu). Cards get an intro as each one's example is written and checked. */
function studyCard(id){
  const c = byId(id);
  if (!owned(c)) { missingSheet(id); return false; }
  if (c.intro && !(S.skipIntro && S.skipIntro[id])) introSheet(c); else startSession(id);
}
function introSheet(c, readOnly){
  if (!c || !c.intro) return;
  const mine = owned(c);
  readOnly = readOnly || !mine;
  openSheet(`<div class="sh-head">${mine ? thumb(c) : `<span class="sh-mcard">${lockedCardHTML(c)}</span>`}<span><b>${esc(c.name)}</b><small>Read first · about 30 seconds</small></span></div>
    <div class="intro">
      <div class="intro-sec"><em>The idea</em><p>${esc(c.intro.idea)}</p></div>
      <div class="intro-sec ex"><em>Example</em><p>${esc(c.intro.example)}</p></div>
      <p class="intro-src">Source: ${esc(c.intro.source)}</p>
      ${cardVideo(c) ? `<p class="intro-video-tip">Still fuzzy on this rule?</p>${cardVideoButtonHTML(c, 'intro')}` : ''}</div>
    ${readOnly ? `${mine ? `<button class="btn-big gold" data-act="intro-go" data-id="${c.id}">${PLAY_ICON} TRY 5 QUESTIONS</button>` : ''}<button class="sheet-cancel" data-act="sheet-close">Close</button>`
      : `<button class="btn-big gold" data-act="intro-go" data-id="${c.id}">${PLAY_ICON} TRY 5 QUESTIONS</button>
         <button class="sheet-cancel" data-act="intro-skip" data-id="${c.id}">Go straight to questions<small>Skips this intro next time</small></button>`}`);
}
function cardMenu(id){
  const c = byId(id); if (!owned(c)) { missingSheet(id); return; }
  const st = S.cards[id];
  openSheet(`<div class="sh-head">${thumb(c)}<span><b>${esc(c.name)}</b><small>${statusLine(c)}</small></span></div>
    <div class="acts">
      <button data-act="study" data-id="${id}">${PLAY_ICON} ${isCold(st) ? 'Reopen this case' : 'Study this card'}</button>
      ${c.intro ? `<button data-act="intro-read" data-id="${id}">${ICO('read')} Read the intro</button>` : ''}
      <button data-act="card-style" data-id="${id}">${ICO('sparkle')} Card Style</button>
    </div><button class="sheet-cancel" data-act="sheet-close">Cancel</button>`);
}
function missingSheet(id){
  const c = byId(id);
  openSheet(`<div class="sh-missing"><div class="sh-mcard">${lockedCardHTML(c)}</div>
      <h3>${c ? 'Not found yet' : 'Card unavailable'}</h3><p>${c ? `This ${c.trickType ? 'Memory Trick' : 'card'} is waiting in a pack. ${S.packs ? `You have ${S.packs} pack${S.packs > 1 ? 's' : ''} to open.` : 'Study a card you own to earn a pack. This card stays locked until you collect it.'}` : 'This card could not be found.'}</p></div>
    ${S.packs ? `<button class="btn-big gold" data-act="pack-open">${ICO('pack')} OPEN A PACK</button>` : `<button class="btn-big" data-act="tab" data-tab="study">${PLAY_ICON} STUDY YOUR OWNED CARDS</button>`}
    <button class="sheet-cancel" data-act="sheet-close">Not now</button>`);
}
function a2hsSheet(){
  openSheet(`<h3>Add to Home Screen</h3>
    <ol class="steps"><li><span>1</span>Open Becoming a Clerk in <b>Safari</b></li><li><span>2</span>Tap <b>Share</b> <i class="shareico">⬆︎</i></li>
      <li><span>3</span>Choose <b>Add to Home Screen</b></li><li><span>4</span>Open it from your Home Screen. It runs full screen, like an app.</li></ol>
    <p class="foot">Your progress stays saved in Safari on this phone.</p>
    <button class="sheet-cancel" data-act="a2hs-close">Got it</button>`);
}
function quickRound(){
  let mine = CARDS.filter(owned);
  if (!S.quickRounds) mine = mine.filter(c => c.gen !== 'compare').length ? mine.filter(c => c.gen !== 'compare') : mine;   // a first Quick Round skips copy-check cards
  const cold = mine.filter(c => isCold(S.cards[c.id]));
  const open = mine.filter(c => !S.cards[c.id].mastered);
  const c = cold[0] || (open.length ? open[rnd(open.length)] : mine[rnd(mine.length)]);
  if (c) { S.quickRounds = (S.quickRounds || 0) + 1; studyCard(c.id); }
}
function openSessionLayer(){
  if (!app.hidden) return;
  history.pushState({cq:'session'}, '');
  app.hidden = false; app.scrollTop = 0; app.classList.remove('opening'); void app.offsetWidth; app.classList.add('opening');
}
function closeSessionLayer(){
  if (app.hidden) return false;
  document.querySelectorAll('.lu').forEach(x => x.remove());
  app.hidden = true; app.innerHTML = ''; sess = null; view = {name:'home'}; unlockScroll();
  refresh(); return true;
}

/* ================= LONG PRESS: card action menu ================= */
(function longPress(){
  let timer = null, start = null, fired = false;
  document.addEventListener('pointerdown', e => {
    const t = e.target.closest('[data-lp]'); if (!t) return;
    fired = false; start = [e.clientX, e.clientY];
    timer = setTimeout(() => { timer = null; fired = true; t.classList.add('lp-pop'); setTimeout(() => t.classList.remove('lp-pop'), 250); cardMenu(t.dataset.lp); }, 480);
  });
  const cancel = () => { clearTimeout(timer); timer = null; };
  document.addEventListener('pointerup', cancel); document.addEventListener('pointercancel', cancel);
  document.addEventListener('pointermove', e => { if (timer && start && Math.hypot(e.clientX - start[0], e.clientY - start[1]) > 10) cancel(); });
  document.addEventListener('contextmenu', e => { if (e.target.closest('[data-lp]')) e.preventDefault(); });
  // a long press must not also count as a tap
  document.addEventListener('click', e => { if (fired && e.target.closest('[data-lp]')) { fired = false; e.stopImmediatePropagation(); e.preventDefault(); } }, true);
})();

/* ================= BACK / SWIPE-BACK ================= */
// Every push, study round, and pack adds one history entry, so iPhone swipe-back and the Back button agree.
let swipeCommit = null;
window.addEventListener('popstate', () => {
  if (swipeCommit) { const f = swipeCommit; swipeCommit = null; f(); return; }
  document.querySelectorAll('.zoom,.alert-wrap').forEach(x => x.remove()); closeSheet(true);
  const pk = document.querySelector('.pk');
  if (pk) { pk.remove(); unlockScroll(); if (app.hidden) refresh(); return; }
  if (closeSessionLayer()) { if (afterSessionClose) { const f = afterSessionClose; afterSessionClose = null; f(); } return; }
  pop();
});
/* Open a card's Case File tab: switch tabs if its card page is on top, otherwise push it. */
let afterSessionClose = null;
function openCaseFile(id){
  const en = topEntry();
  if (en && en.s === 'card' && en.p.id === id) { en.p = Object.assign({}, en.p, {tab:'rule'}); refresh(); }
  else push('card', {id, tab:'rule'});
  // Scroll to the tabs; again once the card art loads, since the page is too short to scroll until then.
  const scr = currentScreenEl().querySelector('.scr'), tabs = scr.querySelector('.seg');
  if (!tabs) return;
  const jump = () => { scr.scrollTop += tabs.getBoundingClientRect().top - scr.getBoundingClientRect().top - 8; };
  jump(); scr.querySelectorAll('img').forEach(i => { if (!i.complete) i.addEventListener('load', jump, {once:true}); });
}
/* Edge swipe-back that follows your finger (works in Safari and in the Home Screen app). */
(function edgeSwipe(){
  if (window.__CLERK_QUEST_IOS__ === true) return;
  let sx = null, sy = 0, dx = 0, active = false, cur = null, under = null;
  const W = () => window.innerWidth;
  const blocked = () => !app.hidden || document.querySelector('.pk,.sheet-wrap,.alert-wrap,.zoom,.lu,#login-root,#wl-root');
  document.addEventListener('touchstart', e => {
    if (blocked() || nav.stacks[nav.tab].length < 2) return;
    const t = e.touches[0]; if (t.clientX > 28) return;
    sx = t.clientX; sy = t.clientY; dx = 0; active = false; cur = currentScreenEl();
  }, {passive:true});
  document.addEventListener('touchmove', e => {
    if (sx == null || !cur) return;
    const t = e.touches[0]; dx = t.clientX - sx;
    if (!active) {
      if (Math.abs(t.clientY - sy) > Math.abs(dx)) { sx = null; return; }
      if (dx < 10) return;
      active = true; saveScroll();
      const st = nav.stacks[nav.tab], depth = st.length - 2;
      under = buildScreen(st[depth], depth); under.style.zIndex = 0; cur.style.zIndex = 2;
      document.getElementById('screens').insertBefore(under, cur);
      under.querySelector('.scr').scrollTop = st[depth].scroll || 0;
      cur.style.boxShadow = '-10px 0 30px rgba(0,0,0,.45)';
    }
    e.preventDefault();
    const x = Math.max(0, dx), f = x / W();
    cur.style.transform = `translateX(${x}px)`;
    under.style.transform = `translateX(${-28 + 28 * f}%)`; under.style.filter = `brightness(${.7 + .3 * f})`;
  }, {passive:false});
  const end = () => {
    if (sx == null) return; sx = null;
    if (!active) return; active = false;
    const done = dx > W() * .33, ease = 'transform .26s cubic-bezier(.2,.8,.2,1), filter .26s';
    cur.style.transition = ease; under.style.transition = ease;
    const c = cur, u = under; cur = under = null;
    if (done) {
      c.style.transform = `translateX(${W()}px)`; u.style.transform = 'none'; u.style.filter = 'none';
      setTimeout(() => {
        swipeCommit = () => {
          nav.stacks[nav.tab].pop(); c.remove();
          u.style.cssText = ''; u.classList.add('current'); renderTabbar();
        };
        history.back();
      }, 260);
    } else {
      c.style.transform = 'none'; u.style.transform = 'translateX(-28%)';
      setTimeout(() => { u.remove(); c.style.cssText = ''; }, 270);
    }
  };
  document.addEventListener('touchend', end); document.addEventListener('touchcancel', end);
})();
function goBack(){ if (history.state && history.state.cq) history.back(); else pop(); }

/* ================= TAPS ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const act = t.dataset.act, id = t.dataset.id;
  switch (act) {
    case 'tab': closeSheet(true); switchTab(t.dataset.tab); break;
    case 'back': goBack(); break;
    case 'push': {
      const target = t.dataset.s || '', restricted = /^admin/.test(target) || target === 'rewardpreview' || target === 'glows';
      if (restricted && !ADM.is) { toast('Admins only'); break; }
      const p = {}; if (id) p.id = id; if (t.dataset.g) p.g = t.dataset.g; closeSheet(true); push(target, p); break;
    }
    case 'seg': { const en = topEntry(); en.p = Object.assign({}, en.p, {[t.dataset.k]:t.dataset.v}); refresh(); break; }
    case 'stage': { const en = topEntry(); en.p = Object.assign({}, en.p, {preview:+t.dataset.l}); refresh(); break; }
    case 'study': closeSheet(true); studyCard(id); break;
    case 'intro-go': closeSheet(true); startSession(id); break;
    case 'intro-skip':
      if (!canStudyCard(id)) { closeSheet(true); missingSheet(id); break; }
      ((S.skipIntro = S.skipIntro || {})[id] = true); save(); closeSheet(true); startSession(id); break;
    case 'intro-read': closeSheet(true); introSheet(byId(id), true); break;
    case 'quick': closeSheet(true); quickRound(); break;
    case 'answer': closeSheet(true); answer(t.dataset.v); break;
    case 'ans-sheet': answerSheet(t.dataset.v); break;
    case 'hint': if (sess && !sess.answered && !sess.hint) { sess.hint = true; S.stats.hints = (S.stats.hints || 0) + 1; if (boosts().freeHints > 0) { boosts().freeHints--; sess.freeHint = true; } save(); paintStudy(); } break;
    case 'next': next(); break;
    case 'lu-close': { const ov = t.closest('.lu'); ov && ov._done(); break; }
    case 'session-close': goBack(); if (typeof guestWall === 'function') guestWall(); break;   // a guest sees the sign-up screen after their results
    case 'read-rule': if (app.hidden) openCaseFile(id); else { afterSessionClose = () => openCaseFile(id); goBack(); } break;
    case 'study-help': studyHelpSheet(id); break;
    case 'sheet-close-jump': closeSheet(true); if (topEntry().s === 'card' && topEntry().p.id === id) { const en = topEntry(); en.p = Object.assign({}, en.p, {tab:'rule'}); refresh(); requestAnimationFrame(() => { const panels = document.querySelectorAll('.cd-panel'); const el = panels[panels.length - 1]; el && el.scrollIntoView({behavior:'smooth', block:'start'}); }); } else openCaseFile(id); break;
    case 'cd-jump': {   // switch to the rule tab and scroll down to it
      const en = topEntry(); en.p = Object.assign({}, en.p, {tab:'rule'}); refresh();
      requestAnimationFrame(() => { const panels = document.querySelectorAll('.cd-panel'); const el = panels[panels.length - 1]; el && el.scrollIntoView({behavior:'smooth', block:'start'}); });
      break; }
    case 'watch-explanation': openLessonVideo(id || 'eightback', t.dataset.from, t.dataset.card); break;
    case 'intro-back': introSheet(byId(id)); break;
    case 'mark-read': {
      S.read = S.read || {};
      if (!S.read[id]) { S.read[id] = Date.now(); S.stats.xp += READ_XP; save(); toast(`Case file reviewed · +${READ_XP} XP`); }
      refresh(); break;
    }
    case 'pack-open': closeSheet(true); openPack(); break;
    case 'pk-tear': tearPack(t); break;
    case 'pk-auto': { const ov = t.closest('.pk'), pkb = ov && ov.querySelector('.pk-pack'); if (pkb) { pkb._swiped = false; tearPack(pkb); } t.hidden = true; break; }
    case 'pk-flip': flipPackCard(t); break;
    case 'pk-done': goBack(); if (typeof guestWall === 'function') guestWall(); break;
    case 'pk-sticker': openSticker(t.closest('.pk')); break;
    case 'bstk-auto': { const l = t.closest('.bstk'); if (l._ctl) { l._ctl.autoPeel(); t.disabled = true; } break; }
    case 'bstk-take': { const l = t.closest('.bstk'); l._peeled && l._peeled(); break; }
    case 'bstk-ans': { const l = t.closest('.bstk'); if (l && l._quiz && !t.disabled) surpriseAnswer(l, +t.dataset.i); break; }
    case 'bstk-done': t.closest('.bstk').remove(); break;
    case 'bstk-stick': { const uid = t.closest('.pk')._sticker.uid; goBack(); setTimeout(() => chooseBinderSheet(uid), 350); break; }
    case 'zoom-close': t.closest('.zoom').remove(); unlockScroll(); break;
    case 'card-menu': cardMenu(id); break;
    case 'missing': missingSheet(id); break;
    case 'sheet-close': closeSheet(); break;
    case 'a2hs-show': a2hsSheet(); break;
    case 'cloud-signin': closeSheet(true); openSignIn(t.dataset.tab || 'signin'); break;
    case 'cloud-signout':
      CQCloud.signOut().catch(err => toast(err.message || 'Could not sign out')); break;
    case 'a2hs-close': try { localStorage.setItem('cq-a2hs', '1'); } catch(err){} closeSheet(); refresh(); break;
    case 't-level': {
      if (!ADM.is) break;
      closeSheet(true);
      const st = S.cards[id], c = byId(id), from = st.level; if (st.mastered) break;
      let pl;
      if (st.level < maxL(c)) { st.level++; st.xp = 0; pl = {from, to:st.level}; } else { st.mastered = true; st.xp = NEED[st.level-1]; pl = {from:st.level, to:st.level, mastered:true}; }
      save(); const en = topEntry(); if (en.p) delete en.p.preview;
      showLevelUp(id, pl, () => refresh()); break;
    }
    case 't-cold': { if (!ADM.is) break; closeSheet(true); const st = S.cards[id]; st.last = Date.now() - coldAfter(st) - DAY; save(); refresh(); toast('Card went cold', 'thermo_snow'); break; }
    case 't-reset': { if (!ADM.is) break; closeSheet(true); Object.assign(S.cards[id], {level:1, xp:0, mastered:false}); save(); const en = topEntry(); if (en.p) delete en.p.preview; refresh(); toast('↺ Card reset to Level 1'); break; }
    case 't-pack': if (ADM.is) { S.packs++; save(); refresh(); toast('Test pack added', 'pack'); } break;
    case 'claim': claimQuest(t.dataset.kind, t.dataset.q); break;
    case 'claim-all': { const list = readyList(); list.forEach(([k, q]) => { if (k === 'daily') { daily().claimed[q.id] = true; onbFlag('claimed'); earnCoins(COINS.dailyQuest, `Daily quest: ${q.label}`); } else { S.milestones = S.milestones || {}; S.milestones[q.id] = true; } });
      S.packs += list.length; save(); if (list.length) nativeFeedback('claim'); refresh(); toast(`+${list.length} pack${list.length > 1 ? 's' : ''} claimed`, 'pack'); break; }
    case 'sort-sheet': sortSheet(); break;
    case 'sort': nav.sort = t.dataset.v; refresh(); sortSheet(); break;
    case 'toggle-missing': nav.showMissing = nav.showMissing === false; refresh(); sortSheet(); break;
    case 'resetall':
      iosAlert({title:'Reset all progress?', msg:'Every card, level, and pack on this device will be erased. Your notebook is kept. This can\'t be undone.',
        buttons:[{label:'Cancel', value:false, style:'bold'}, {label:'Reset', value:true, style:'destructive'}]})
        .then(ok => { if (!ok) return; const keepNotes = S.notebook; S = normalize(null); if (keepNotes) S.notebook = keepNotes; save(); TABS.forEach(([tid]) => nav.stacks[tid] = [{s:tid, p:{}}]); nav.tab = 'home'; showScreen('none'); });
      break;
  }
});

/* ================= START ================= */
const SPLASH_AT = Date.now();
let splashPct = 8;
function splashSet(p, text){   // move the loading bar forward (never back) and optionally change the caption
  splashPct = Math.max(splashPct, p);
  const i = document.querySelector('#splash .sp-bar i'), c = document.querySelector('#splash .sp-cap');
  if (i) i.style.width = splashPct + '%'; if (c && text) c.textContent = text;
}
const splashCreep = setInterval(() => { if (splashPct < 88) splashSet(splashPct + (88 - splashPct) * .06); }, 200);   // keeps creeping so it never looks stuck
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => splashSet(35));
function hideSplash(){
  clearInterval(splashCreep); splashSet(100, 'Ready!');
  const el = document.getElementById('splash'); if (!el) return;
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 700); }, Math.max(0, 1400 - (Date.now() - SPLASH_AT)));
}
setTimeout(hideSplash, 7000);   // safety net: never trap the player behind the loading screen
probeArt().then(async () => {
  splashSet(60, 'Shuffling the cards…');
  try { if (window.CQCloud) await CQCloud.init(); }
  catch (error) { console.warn('Cloud save unavailable:', error); }
  if (/[?&]demo=glows/.test(location.search)) { nav.tab = 'profile'; nav.stacks.profile = [{s:'profile', p:{}}, {s:'glows', p:{}}]; }
  splashSet(85, 'Setting up your desk…');
  history.replaceState({}, '');
  showScreen('none');
  requireLogin();   // guests play until their first round ends, then sign up; the welcome shows on first run
  hideSplash();
});
window.addEventListener('cq-cloud', e => {
  if (nav.tab === 'profile') refresh();
});
// Decode the card frames and backs up front: Safari won't decode hidden images, which caused a gray flash mid-flip.
['art/back_card.webp','art/frame_base.webp','art/frame_mid.webp','art/frame_premium.webp','art/frame_trick.webp','art/frame_s4.webp','art/frame_s5.webp','art/frost_stencil_v1.webp','art/cardback.webp','art/answer_button.webp']
  .forEach(src => { const i = new Image(); i.src = src; if (i.decode) i.decode().catch(() => {}); });
</script>
