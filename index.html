.cback{position:absolute;inset:0;border-radius:7%/4.7%;border:3px solid #f1e5c9;box-shadow:0 0 0 3px var(--ink),0 10px 18px rgba(0,0,0,.55);
  background:radial-gradient(circle at 50% 50%,#3a4d70 0 30%,transparent 31%),repeating-linear-gradient(45deg,#2b3a55 0 10px,#26344d 10px 20px);display:flex;align-items:center;justify-content:center}
.cback span{font-family:"Luckiest Guy";color:#f1e5c9;text-align:center;font-size:clamp(14px,4vw,24px);line-height:.95;letter-spacing:.04em;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;transform:rotate(-8deg)}
.cback span i{font-style:normal;color:var(--brick)}
/* home pack button */
.packbtn{display:flex;align-items:center;gap:14px;width:100%;margin:14px 0 0;padding:10px 16px;border:3px solid var(--ink);border-radius:16px;background:var(--mustard);color:var(--ink);box-shadow:0 6px 0 var(--ink);text-align:left}
.packbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.packbtn img{height:74px;transform:rotate(-8deg);animation:packidle 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.packbtn b{display:block;font-family:"Luckiest Guy";font-weight:400;font-size:22px;letter-spacing:.05em}
.packbtn small{font-size:17px}
.packnote{text-align:center;margin:14px 0 0;opacity:.75;font-size:17px}
/* pack opening */
.pk{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;
  background:radial-gradient(circle at 50% 42%,#4a3516,#100e0b 72%);overflow:hidden;animation:fadein .2s both}
.pk-rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:42%;translate:-50% -50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,210,90,.12) 0 8deg,transparent 8deg 20deg);animation:spin 30s linear infinite}
.pk-stage{position:relative;width:min(94vw,600px);height:min(60vh,520px);display:flex;align-items:center;justify-content:center}
.pk-pack{position:absolute;width:min(56vw,250px,36vh);aspect-ratio:640/975;border:0;background:none;padding:0;z-index:3;animation:packidle 2.4s ease-in-out infinite}
.pk-pack img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 14px 18px rgba(0,0,0,.6))}
@keyframes packidle{50%{transform:translateY(-8px) rotate(1.5deg)}}
.pk-pack.shake{animation:shake .45s linear 2}
.pk-pack.torn{animation:none;pointer-events:none}
.pk-pack.torn .pk-top{transition:transform .7s cubic-bezier(.3,.8,.4,1),opacity .6s .25s;transform:translate(35%,-130%) rotate(30deg);opacity:0}
.pk-pack.torn.from-r .pk-top{transform:translate(-35%,-130%) rotate(-30deg)}
/* swipe to rip: a dotted tear line with a moving arrow until the rip starts */
.pk-pack{touch-action:none}
.pk-pack.ripping{animation:none}
.pk-cut{position:absolute;left:5%;right:5%;height:0;z-index:2;border-top:2px dashed rgba(255,248,220,.7);filter:drop-shadow(0 1px 2px rgba(0,0,0,.8));pointer-events:none;transition:opacity .2s}
.pk-pack.ripping .pk-cut,.pk-pack.torn .pk-cut,.pk-pack.shake .pk-cut{opacity:0}
.pk-pack.torn .pk-body{transition:transform .8s .5s ease-in,opacity .5s .85s;transform:translateY(80%);opacity:0}
.pk-cards{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.4vw,18px);z-index:2;pointer-events:none}
.pk-card{position:relative;width:min(29vw,170px,22vh);aspect-ratio:1024/1536;border:0;background:none;padding:0;perspective:1000px;opacity:0;transform:translateY(45%) scale(.45);
  transition:transform .7s cubic-bezier(.2,1.4,.4,1),opacity .4s;transition-delay:calc(.55s + var(--i) * .18s)}
.pk.out .pk-cards{pointer-events:auto}
.pk.out .pk-card{opacity:1;transform:none}
.pk.out .pk-card:nth-child(1){transform:rotate(-6deg) translateY(12px)}
.pk.out .pk-card:nth-child(3){transform:rotate(6deg) translateY(12px)}
.pk-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.pk-card.flipped .pk-inner{animation:pkflip .62s linear forwards}
@keyframes pkflip{0%{transform:rotateY(0);animation-timing-function:cubic-bezier(.5,0,.9,.6)}50%{transform:rotateY(90deg) scale(1.12);animation-timing-function:cubic-bezier(.1,.4,.5,1)}100%{transform:rotateY(180deg)}}
.pk-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pk-front{transform:rotateY(180deg)}
.pk-card:not(.flipped) .pk-front,.pk-card.flipped .pk-back{pointer-events:none}
.pk-face{transition:opacity 0s linear .31s}
.pk-card:not(.flipped) .pk-front,.pk-card.flipped .pk-back{opacity:0}
.cbackimg{width:100%;height:100%;object-fit:cover;border-radius:6%/4%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.pk-badge{position:absolute;left:50%;top:-12px;translate:-50% 0;z-index:9;font-family:"Bangers";letter-spacing:.06em;font-size:clamp(13px,3.4vw,18px);padding:3px 10px;border:2px solid var(--ink);border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .3s .45s;color:var(--ink)}
.pk-card.flipped .pk-badge{opacity:1}
.pk-badge.new{background:#ffe27a} .pk-badge.dup{background:#bfe0b5} .pk-badge.trick{background:#d6c2ff}
.zoom{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;
  background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadein .2s both;cursor:pointer}
.zoom-card{width:min(88vw,420px,calc((100dvh - 90px) / 1.5));animation:zoomin .32s cubic-bezier(.2,1.3,.4,1) both}
.zoom p{margin:0;color:var(--paper);opacity:.75}
@keyframes zoomin{from{transform:scale(.6);opacity:0}}
.pk-label.series45{left:15%;top:28%;width:70%;height:34%;display:grid;place-items:center;padding:8%;box-sizing:border-box;border:3px solid #1d1b17;color:#1d1b17;text-align:center;transform:rotate(-4deg);box-shadow:3px 4px 0 rgba(0,0,0,.35)}
.pk-label.series45 b{font:clamp(19px,5vw,29px)/.9 "Bangers";letter-spacing:.04em}
.pk-label.series45.s4{background:#fbf6e8;border-radius:48% 52% 46% 54%;text-decoration:underline;text-decoration-style:wavy;text-decoration-color:#cf3b2a;text-underline-offset:5px}
.pk-label.series45.s5{background:linear-gradient(135deg,#f0c755 0 48%,#c23a35 49% 100%);clip-path:polygon(50% 0,61% 19%,82% 8%,78% 31%,100% 36%,80% 50%,96% 67%,73% 68%,72% 93%,53% 78%,38% 100%,32% 76%,7% 88%,20% 62%,0 51%,22% 42%,5% 21%,31% 25%);padding:13%}
.pk-hint{margin:0;font-size:20px;color:var(--paper);z-index:3;text-align:center;min-height:26px}
.pk-auto{z-index:3;max-width:340px;color:var(--paper)}
.pk.out .pk-auto,.pk.all .pk-auto{display:none}
.pk-done{max-width:340px;z-index:3;opacity:0;pointer-events:none;transition:opacity .3s}
.pk.all .pk-done{opacity:1;pointer-events:auto}
.pk-coin{display:none;z-index:3;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:40px;background:rgba(0,0,0,.45);border:2px solid rgba(227,178,60,.6)}
.pk.all .pk-coin{display:flex;animation:coinpop .6s cubic-bezier(.2,1.5,.4,1) .3s both}
.pk-coin img{width:54px;height:54px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));animation:coinspin 1.2s ease-out .3s both}
.pk-coin b{display:block;font:400 22px/1 "Bangers";letter-spacing:.05em;color:var(--mustard)}
.pk-coin small{font:15px "Patrick Hand";color:var(--paper)}
@keyframes coinpop{from{transform:scale(.3);opacity:0}}
@keyframes coinspin{from{transform:rotateY(540deg)}}
/* bonus sticker: a layer over the pack with the 3D peel (sticker3d.js) */
.bstk{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;
  background:radial-gradient(circle at 50% 42%,#34281a,#0d0b09);animation:fadein .3s both}
.bstk-h{margin:0;font:400 34px/1 "Bangers";letter-spacing:.05em;color:var(--mustard);text-shadow:0 3px 0 var(--ink)}
.bstk-tag{font:400 17px/1 "Bangers";letter-spacing:.08em;padding:5px 12px;border:2px solid var(--ink);border-radius:999px;color:var(--ink);background:#e8dcc0}
.bstk-tag.shiny{background:linear-gradient(100deg,#ffb3d9,#b3e5ff,#c9ffb3,#fff0a8,#ffb3d9);background-size:200% 100%;animation:holotag 3s linear infinite}
@keyframes holotag{to{background-position:200% 0}}
.bstk-stage{position:relative;width:min(84vw,340px);height:min(84vw * 1.1,374px,48vh);border-radius:18px;touch-action:none}
.bstk-stage > img{width:100%;height:100%;object-fit:contain;padding:8%;box-sizing:border-box}
.bstk-hint{margin:0;font-size:19px;color:var(--paper);text-align:center;min-height:25px;max-width:320px}
.bstk .btn-big,.bstk .sheet-cancel{max-width:340px}
/* surprise under the peeled sticker */
.cd-quick{display:flex;gap:8px;justify-content:center;margin:2px 0 12px}
.cd-qbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:2px solid var(--ink);border-radius:20px;background:#f3d27a;color:var(--ink);font:700 15px var(--ui);cursor:pointer}
.cd-qbtn .ico{width:18px;height:18px}.cd-qbtn.vid{background:#5d7d8c;color:#fff8ea}.cd-qbtn span{font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.04em}
.intro-video-tip{margin:12px 0 6px;text-align:center;color:var(--sub);font-size:16px}
.bstk-stage .sur{position:absolute;inset:0;box-sizing:border-box;padding:14px;border:3px solid var(--ink);border-radius:18px;background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;overflow:auto;animation:fadein .3s both}
.sur b{font:400 30px/1 "Bangers";letter-spacing:.05em}
.sur.win b{color:var(--brick)}
.sur-big{font:400 40px/1 "Luckiest Guy"}
.sur p{margin:0;font-size:19px;line-height:1.2}
.sur-opts{display:grid;gap:7px;width:100%}
.sur-opts button{font:inherit;font-size:17px;line-height:1.15;padding:8px 10px;border:2.5px solid var(--ink);border-radius:10px;background:#fff7e0;color:var(--ink);text-align:left}
.sur-opts button.ok{background:#9bb68a}.sur-opts button.no{background:#e08a7a}

/* stamps */
.stamp{z-index:6;font-family:"Luckiest Guy";padding:1.2cqw 3cqw;border:.9cqw solid currentColor;border-radius:2cqw;letter-spacing:.07em;
  background:rgba(255,255,255,.12);mix-blend-mode:multiply;opacity:.92;transform:rotate(-12deg);pointer-events:none;
  -webkit-mask-image:radial-gradient(circle at 30% 40%, #000 60%, rgba(0,0,0,.75) 100%);animation:slam .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{0%{transform:rotate(-12deg) scale(2.4);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:.92}}
.stampimg{position:absolute;z-index:6;pointer-events:none;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.35));animation:slamimg .35s cubic-bezier(.2,1.6,.4,1) both}
.stampimg.big{width:58%;left:21%;top:23.5%;--rot:-6deg}
.mn-badge.corner{top:auto;bottom:1%;left:auto;right:0;width:17%}
.mn-badge.low{top:auto;bottom:17%;left:1%;width:21%}
.frost{position:absolute!important;inset:0;z-index:8;overflow:hidden;border-radius:5.8%/3.9%;pointer-events:none;transition:filter .8s ease}
.frost-glaze{position:absolute;inset:0;opacity:var(--frost-glaze-opacity);mix-blend-mode:color;
  background:radial-gradient(ellipse 58% 49% at 50% 48%,transparent 0 42%,rgba(113,181,232,.2) 70%,rgba(77,145,211,.68) 100%),
    linear-gradient(155deg,rgba(210,241,255,.2),rgba(64,129,207,.52));transition:opacity .8s ease}
.frost-stencil{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:var(--frost-ice-opacity);
  filter:drop-shadow(0 0 .7cqw rgba(215,244,255,.9));transition:opacity .8s ease;
  -webkit-mask-image:radial-gradient(ellipse 72% 68% at 50% 48%,transparent 0 var(--frost-hole),rgba(0,0,0,.28) calc(var(--frost-hole) + 7%),#000 calc(var(--frost-hole) + 15%));
  mask-image:radial-gradient(ellipse 72% 68% at 50% 48%,transparent 0 var(--frost-hole),rgba(0,0,0,.28) calc(var(--frost-hole) + 7%),#000 calc(var(--frost-hole) + 15%))}
.frost-status{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.card.cold{--glow:0 0 3cqw rgba(140,200,255,.8)}
.card.cold>.ring,.card.cold>.gloss{display:none}
.stampimg.mastered{width:52%;right:2%;top:57%;--rot:-10deg}
@keyframes slamimg{0%{transform:rotate(var(--rot)) scale(2.2);opacity:0}100%{transform:rotate(var(--rot)) scale(1);opacity:1}}
.stampimg{transform:rotate(var(--rot))}
.stamp.mastered{color:#b8860b;font-size:7cqw;right:4%;top:56%}
.stamp.big{font-size:11cqw;left:50%;top:26%;translate:-50% 0}
.stamp.ok{color:var(--good)} .stamp.no{color:var(--bad)}

/* back */
.lvtag{font-size:6.8cqw;letter-spacing:.04em;transform:rotate(-3deg)}
.counter{font-family:"Bangers";font-size:4.6cqw;letter-spacing:.05em;white-space:nowrap}
.bnum{font-size:6.2cqw;letter-spacing:.04em}
.brar{font-family:"Bangers";font-size:3.8cqw;letter-spacing:.08em;color:#fff}
.bcat{font-family:"Bangers";font-size:3.5cqw;letter-spacing:.04em;line-height:1.05;padding:0 1cqw}
.qtext{font-family:"Patrick Hand";justify-content:flex-start;text-align:left;padding:0 2cqw;line-height:1.12;color:var(--ink)}
.ans{z-index:3;border:0;padding:0;background:#f6e7c8;border:.5cqw solid var(--ink);border-radius:2.4cqw;box-shadow:0 .8cqw 0 rgba(0,0,0,.28);overflow:hidden;display:flex;align-items:center;
  transition:transform .12s, filter .2s;touch-action:manipulation}
.ans::before{content:"";position:absolute;left:0;right:0;top:-.7cqw;bottom:-.7cqw}
@media (hover:hover){.ans:hover:not([disabled]){transform:translateX(.8cqw)}}
.ans:active:not([disabled]){transform:scale(.97)}
.ans .L{width:17.4%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;background:#5d7d8c;border-right:.5cqw solid var(--ink);font-family:"Luckiest Guy";font-size:7cqw;-webkit-text-stroke:.3cqw var(--ink);paint-order:stroke fill}
.ans .A{flex:1;text-align:left;padding-left:3cqw;padding-right:1.5cqw;font-family:"Patrick Hand";font-size:5.4cqw;color:var(--ink);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ans .A.wrap{white-space:normal;line-height:1.02;overflow:visible}
.ans.right{filter:drop-shadow(0 0 1.4cqw rgba(63,143,74,.9))}
.ans.right .A{color:#1f6b2b;font-weight:bold}
.ans.wrong{opacity:.6}
.ans.wrong .A{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:.5cqw}
.ans[disabled]{cursor:default}
.ans.cut .A,.ans.cut .A.wrap{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;padding-right:9cqw}
.qtext.cut{cursor:pointer}
.qtext.cut .qt{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;padding-right:9cqw}
.ans .more,.qtext .more{position:absolute;right:1.4cqw;bottom:1.2cqw;padding:.3cqw 1.2cqw;border-radius:1.2cqw;background:var(--ink);color:#f6e7c8;font-family:"Bangers";letter-spacing:.06em;font-size:2.8cqw;line-height:1.2}
.qtext .more{bottom:.4cqw}
.mascot{z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none}
.mascot img{width:100%;height:100%;object-fit:contain;-webkit-mask-image:radial-gradient(ellipse 60% 58% at 50% 50%, #000 70%, transparent 100%);mask-image:radial-gradient(ellipse 60% 58% at 50% 50%, #000 70%, transparent 100%)}
.mascot img.cutm{-webkit-mask-image:none;mask-image:none;filter:drop-shadow(0 1cqw 0 rgba(0,0,0,.2));animation:bob 3s ease-in-out infinite}
.mascot .me{font-size:22cqw;position:relative;filter:drop-shadow(0 1cqw 0 rgba(0,0,0,.2));animation:bob 3s ease-in-out infinite}
.mascot .bub{position:absolute;right:6%;top:6%;font-family:"Luckiest Guy";font-size:8cqw;color:var(--ink);background:#fffaf0;border:.5cqw solid var(--ink);border-radius:50%;width:13cqw;height:13cqw;display:flex;align-items:center;justify-content:center}
@keyframes bob{50%{transform:translateY(-1.5cqw) rotate(-3deg)}}
.hint{z-index:3;border:0;background:none;padding:0 2.5cqw;gap:2.4cqw;justify-content:flex-start;text-align:left;font-family:"Patrick Hand";font-size:4cqw;line-height:1.1;touch-action:manipulation}
.hint .bulb{font-size:9cqw;flex:none;filter:grayscale(.2)}
.hint b{font-family:"Luckiest Guy";font-size:4.4cqw;display:block;margin-bottom:.6cqw;letter-spacing:.05em}
.hint.used .bulb{filter:drop-shadow(0 0 2cqw #ffe26a)}
.pts{flex-direction:column;gap:1.6cqw;font-size:4.2cqw;letter-spacing:.04em}
.pts .v{font-size:9.5cqw;display:flex;align-items:center;gap:1.5cqw;white-space:nowrap}
.pts .v.half{font-size:7.4cqw}
.pts .v s{font-size:4cqw;opacity:.55}
.nxtab{font-size:5cqw;letter-spacing:.04em;white-space:nowrap}
.nxl{flex-direction:column;align-items:flex-start;gap:1.6cqw;font-family:"Patrick Hand";font-size:4cqw;text-align:left;padding:0 1cqw}
.bar{width:100%;height:4cqw;border:.45cqw solid var(--ink);border-radius:2cqw;background:rgba(255,255,255,.55);overflow:hidden}
.bar b{display:block;height:100%;background:repeating-linear-gradient(45deg,#58a35f 0 2cqw,#4b9453 2cqw 4cqw);transition:width .8s cubic-bezier(.2,.9,.3,1)}
.nxr{flex-direction:column;align-items:flex-start;justify-content:center;gap:.8cqw;font-family:"Patrick Hand";font-size:3.9cqw;text-align:left;padding-left:3cqw;border-left:.35cqw solid rgba(0,0,0,.6)}
.nxr b{font-family:"Luckiest Guy";font-size:4cqw;letter-spacing:.04em;display:flex;gap:1.5cqw;align-items:center;margin-bottom:.6cqw}
/* explanation note */
.explain{font-size:4.1cqw;z-index:7;background:#fbf4e2;border:.5cqw solid var(--ink);border-radius:2cqw;padding:3cqw 4cqw;color:var(--ink);overflow:auto;
  box-shadow:0 1.2cqw 0 rgba(0,0,0,.35);transform:rotate(-.6deg);animation:slideup .35s cubic-bezier(.2,1.3,.4,1) both;font-size:4.1cqw;line-height:1.15}
.explain::before{content:"";position:absolute;top:-2cqw;left:42%;width:16cqw;height:4.5cqw;background:rgba(222,196,130,.85);transform:rotate(-4deg);border:.2cqw solid rgba(0,0,0,.15)}
.explain h3{margin:0 0 1.4cqw;font-family:"Luckiest Guy";font-weight:400;font-size:1.32em;letter-spacing:.05em;text-transform:uppercase}
.explain h3.ok{color:var(--good)} .explain h3.no{color:var(--bad)}
.explain p{margin:0 0 1.4cqw}
.explain .cols{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,2),auto);grid-template-columns:1fr 1fr;gap:.4cqw 3cqw;margin:0 0 1.4cqw;line-height:1.1}
.explain .cols.one{grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none}
.explain .cols span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.explain .reopen img{display:block;width:62%;margin:0 auto .6cqw;transform:rotate(-3deg);animation:slamimg .35s cubic-bezier(.2,1.6,.4,1) both;--rot:-3deg}
.explain .reopen span{display:block;text-align:center}
.explain .reopen{background:#dff0ff;border:.3cqw solid #3d7fb8;border-radius:1.4cqw;padding:1cqw 2cqw;color:#1d4f7a}
.explain mark{background:#ffd76a;color:inherit;border-radius:.6cqw;padding:0 .3cqw}
.explain .mono{font-family:"Courier Prime";font-size:.85em}
@keyframes slideup{from{transform:translateY(20%) rotate(-.6deg);opacity:0}}
/* record-compare panel */
.rec{z-index:3;flex-direction:column;align-items:stretch;justify-content:flex-start;background:#fbf6e8;border:.45cqw solid var(--ink);border-radius:2.4cqw;padding:3cqw 3cqw 2cqw;gap:1.6cqw;
  background-image:repeating-linear-gradient(0deg, transparent 0 7.4cqw, rgba(80,120,170,.18) 7.4cqw 7.7cqw)}
.rec .rq{font-family:"Patrick Hand";font-size:4.8cqw;text-align:left;line-height:1.05}
.rec .rh,.rec .rr{display:grid;grid-template-columns:5cqw 1fr 1fr;gap:1.6cqw;align-items:center;text-align:left}
.rec .rh{font-family:"Bangers";font-size:3.4cqw;letter-spacing:.08em;opacity:.7}
.rec .rr{font-family:"Courier Prime";font-weight:700;font-size:3.3cqw;padding:1.2cqw 0;border-bottom:.25cqw dashed rgba(0,0,0,.25)}
.rec .rr span:first-child{font-family:"Luckiest Guy";font-weight:400;font-size:4.2cqw}
.rec .rr mark{background:#ffd76a}

/* ---------- LAYOUT PIECES ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 auto 12px;max-width:640px}
.btn-ghost{background:rgba(255,255,255,.06);border:2px solid rgba(241,229,201,.25);border-radius:999px;padding:8px 14px;min-height:44px;color:var(--paper)}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-width:0}
.dots.many{gap:4px} .dots.many i{width:9px;height:9px;border-width:1.5px}
#sxp{white-space:nowrap;flex:none}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--paper);opacity:.5}
.dots i.ok{background:var(--good);border-color:var(--good);opacity:1}
.dots i.no{background:var(--bad);border-color:var(--bad);opacity:1}
.dots i.cur{opacity:1;box-shadow:0 0 0 3px rgba(241,229,201,.25)}
.chip{font-family:"Bangers";letter-spacing:.06em;font-size:18px;background:var(--mustard);color:var(--ink);border-radius:999px;padding:6px 12px;border:2px solid var(--ink)}
.btn-big{display:block;width:100%;min-height:58px;border:3px solid var(--ink);border-radius:16px;background:var(--brick);color:#fff8ea;
  font-family:"Luckiest Guy";font-size:23px;letter-spacing:.07em;box-shadow:0 6px 0 var(--ink);transition:transform .08s, box-shadow .08s;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.btn-big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn-big.alt{background:var(--paper);color:var(--ink);-webkit-text-stroke:0}
.btn-big.gold{background:var(--mustard);color:var(--ink);-webkit-text-stroke:0}

/* study */
.stage{perspective:1400px;display:flex;flex-direction:column;align-items:center;position:relative}
.lifter{position:relative;z-index:1}
.stage.flipping .lifter{animation:lift .52s cubic-bezier(.65,0,.35,1)}
@keyframes lift{0%{transform:none}12%{transform:scale(.985)}50%{transform:translateY(-3%) scale(1.05)}100%{transform:none}}
.stage-shadow{width:calc(var(--cw) * .8);height:18px;margin-top:-10px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);transition:opacity .3s}
.stage.flipping .stage-shadow{animation:shadowshrink .52s cubic-bezier(.65,0,.35,1)}
@keyframes shadowshrink{50%{transform:scaleX(.75);opacity:.35}}
.stage.flipping .face .card::before{content:"";position:absolute;inset:1.3% 1.7% 1.6%;border-radius:5cqw;z-index:30;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:300% 100%;animation:glint .52s ease-in-out both}
@keyframes glint{from{background-position:150% 0}to{background-position:-50% 0}}
.flip{position:relative;width:var(--qw);aspect-ratio:1024/1792;transform-style:preserve-3d;transition:transform .52s cubic-bezier(.65,0,.35,1)}
.flip.flipped{transform:rotateY(180deg)}
.face{position:absolute !important;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{display:flex;align-items:center}
#back.card{aspect-ratio:1024/1792}
/* the verdict stamp lands on the mascot (or the title, on copy-check cards), never on the question */
#back .stampimg.big{width:54%;left:auto;right:0;top:40%;--rot:-8deg}
#back .stampimg.big.top{width:58%;left:21%;right:auto;top:3.5%;--rot:-5deg}
/* the question side is drawn in 3 slices so its middle (plain paper) can stretch */
.bgs{position:absolute;left:0;width:100%;z-index:0;background:url(art/back_card.webp) no-repeat;pointer-events:none}
.bgs.t{top:0;height:33.4821%;background-size:100% 256.0%;background-position:top}
.bgs.m{top:33.4821%;height:33.2589%;background-size:100% 451.7647%;background-position:0 50.1672%}
.bgs.b{bottom:0;height:33.2589%;background-size:100% 257.7181%;background-position:bottom}
.face.back{transform:rotateY(180deg)}
/* only the side facing the player can be tapped */
.flip:not(.flipped) .face.back, .flip.flipped .face.front{pointer-events:none}
.flip.flipped .face.back{z-index:2}
.face{transition:opacity 0s linear .36s}
.flip:not(.flipped) .face.back, .flip.flipped .face.front{opacity:0}
.face > .card, .pk-face > *{-webkit-transform:translateZ(0);transform:translateZ(0)}
.below{width:var(--qw);margin:16px auto 0;min-height:64px}
.tans{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.tans button{min-height:60px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);font-family:"Luckiest Guy";font-size:28px;box-shadow:0 5px 0 var(--ink)}
.tans button:active:not([disabled]){transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.tans button.right{background:#bfe0b5}
.tans button.wrong{background:#f1b3a8;opacity:.8}
.tans-label{font-family:"Bangers";letter-spacing:.08em;opacity:.8;text-align:center;margin-bottom:8px}
/* copy-check (table) questions: a smaller card so the 0/1/2/3 buttons fit on a short phone without scrolling */
@supports (height:100dvh){ #app.tq{ --qw:min(calc(100vw - 32px), 460px, calc((100dvh - 215px) / 1.75)); } }
#app.tq .below{margin-top:10px}
#app.tq .tans-label{margin-bottom:5px}
#app.tq .tans button{min-height:50px}
.fade-swap{animation:deal .24s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{opacity:0;transform:translateY(3%) rotate(-1.2deg) scale(.97)}}

/* home */
.logo{font-family:"Luckiest Guy";font-size:clamp(46px,11.5vw,84px);line-height:.95;letter-spacing:.04em;text-align:center;margin:18px 0 4px;color:var(--paper);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink), 0 10px 22px rgba(0,0,0,.5);transform:rotate(-2deg)}
.logo span{color:var(--brick)}
.tagline{text-align:center;font-size:20px;opacity:.85;margin:10px 0 22px}
.home-top{max-width:560px;margin:0 auto}
.nudge{display:flex;align-items:center;gap:12px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:12px 16px;margin-bottom:14px;
  transform:rotate(-.6deg);box-shadow:0 5px 0 rgba(0,0,0,.4);font-size:20px;line-height:1.15}
.nudge .z{font-size:30px}
.a2hs{display:flex;align-items:center;gap:10px;background:rgba(143,179,209,.16);border:2px solid rgba(143,179,209,.45);border-radius:14px;padding:10px 12px;margin:-8px 0 16px;font-size:17px;line-height:1.2}
.a2hs > span{font-size:24px}
.a2hs .shareico{display:inline-block;border:1.5px solid currentColor;border-radius:4px;padding:0 3px;font-size:13px}
.a2hs button{margin-left:auto;background:none;border:0;color:var(--paper);font-size:18px;min-width:44px;min-height:44px}
.nudge .nz{width:40px;height:auto}
.coldnudge{background:#e3f1ff;border-color:#1d3f5f}
.btn-big.coldbtn{background:#3d7fb8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 26px}
.stat{background:rgba(255,255,255,.05);border:2px solid rgba(241,229,201,.18);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:"Luckiest Guy";font-size:23px;letter-spacing:.04em;color:var(--mustard);font-weight:400}
.stat small{font-size:14px;opacity:.75}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 12px}
.sec h2{font-family:"Luckiest Guy";font-weight:400;font-size:27px;margin:0;letter-spacing:.05em}
.sec small{font-size:17px;opacity:.75}
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;min-height:40px;padding:6px 14px;border-radius:999px;border:2px solid rgba(241,229,201,.3);background:rgba(255,255,255,.05);color:var(--paper);font-family:"Bangers";letter-spacing:.06em;font-size:17px}
.filters button i{font-style:normal;opacity:.6;margin-left:4px}
.filters button.on{background:var(--mustard);border-color:var(--ink);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:24px}}
.tile{background:none;border:0;padding:0;text-align:left;transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-.6deg)}
.tile .cap{margin-top:8px;font-size:16px;opacity:.85;display:flex;justify-content:space-between;gap:6px}
.lock-ov{z-index:5;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;color:#f6ecd4;font-family:"Bangers";font-size:7cqw;letter-spacing:.06em;text-shadow:0 .5cqw 0 #000}
.lock-ov.mys{justify-content:flex-end;padding-bottom:9%;gap:.6cqw}
.lock-ov.mys span{background:rgba(0,0,0,.55);padding:1cqw 3cqw;border-radius:2cqw;border:.3cqw solid #d8a526;color:#ffe9a8}
.lock-ov small{font-family:"Patrick Hand";font-size:5.2cqw;letter-spacing:0}
footer{margin-top:40px;text-align:center;font-size:15px;opacity:.6;line-height:1.5}
footer button{background:none;border:0;text-decoration:underline;opacity:.9;min-height:44px}

/* detail */
.detail{display:grid;gap:22px;justify-items:center}
.detail .dcard{width:var(--cw)}
.panel{width:100%;max-width:520px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.45)}
.cta-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:18px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(20,17,13,0),rgba(20,17,13,.92) 38%);pointer-events:none}
.cta-bar > div{max-width:520px;margin:0 auto;pointer-events:auto}
.detail{padding-bottom:96px}
.panel h1{font-family:"Luckiest Guy";font-weight:400;font-size:30px;margin:0;line-height:1.05;letter-spacing:.04em;text-transform:uppercase}
.panel .meta{margin:6px 0 14px;font-size:18px;opacity:.8}
.coldnote img{height:28px;vertical-align:middle}
.coldnote{background:#e3f1ff;border:2px solid #3d7fb8;border-radius:12px;padding:8px 12px;margin:-4px 0 14px;font-size:17px}
.warmnote{font-size:16px;opacity:.7;margin:-8px 0 14px}
.panel h3{font-family:"Bangers";letter-spacing:.08em;font-weight:400;font-size:20px;margin:18px 0 8px}
.pbar{height:18px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.pbar b{display:block;height:100%;background:repeating-linear-gradient(45deg,#58a35f 0 10px,#4b9453 10px 20px)}
.prow{display:flex;justify-content:space-between;margin:8px 0 16px;font-size:18px}
.stages{display:flex;gap:8px;flex-wrap:wrap}
.stages button{width:52px;height:52px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-family:"Luckiest Guy";font-size:22px}
.stages button.cur{background:var(--mustard)}
.stages button[disabled]{opacity:.4;cursor:not-allowed}
.lore{margin:0;padding-left:20px;font-size:18px;line-height:1.35}
.lore li.lk{opacity:.45;font-style:italic}
details{margin-top:18px;border-top:2px dashed rgba(0,0,0,.25);padding-top:10px}
summary{cursor:pointer;font-family:"Bangers";letter-spacing:.08em;font-size:18px;min-height:32px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tools button{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:8px 12px;min-height:44px}
.preview-note{font-family:"Bangers";letter-spacing:.08em;color:var(--mustard);min-height:24px;text-align:center}
@media (min-width:900px){.detail{grid-template-columns:auto 1fr;align-items:start;justify-items:start}}

/* results */
.results{max-width:520px;margin:0 auto;text-align:center}
.results h1{font-family:"Luckiest Guy";font-weight:400;font-size:clamp(34px,8.5vw,54px);letter-spacing:.04em;margin:16px 0 0;color:var(--paper);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-2deg)}
.score{font-family:"Luckiest Guy";font-size:78px;line-height:1;margin:16px 0 0;color:var(--mustard);text-shadow:0 5px 0 var(--ink)}
.results .sub{font-size:20px;opacity:.85;margin:4px 0 16px}
.rchips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.rcard{width:min(58vw,240px);margin:0 auto 18px}
.results .panel{text-align:left;margin-bottom:18px}
.almost{font-family:"Luckiest Guy";font-size:22px;color:var(--brick);margin-top:10px}
.stack{display:grid;gap:14px}

/* level up overlay */
.lu{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;
  background:radial-gradient(circle at 50% 45%, rgba(60,40,10,.85), rgba(0,0,0,.93));animation:fadein .3s both;overflow:hidden}
@keyframes fadein{from{opacity:0}}
.lu .rays2{position:absolute;width:160vmax;height:160vmax;left:50%;top:45%;translate:-50% -50%;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,210,90,.16) 0 8deg, transparent 8deg 20deg);animation:spin 24s linear infinite}
.lu.done .rays2{opacity:1;transition:opacity .6s}
.lu .lucard{width:min(72vw,340px, calc((100dvh - 230px)/1.5));animation:rise .5s cubic-bezier(.2,1.4,.4,1) both;position:relative}
@keyframes rise{from{transform:translateY(40px) scale(.7);opacity:0}}
.lu .lucard.shake{animation:shake .5s linear}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-5px) rotate(-1deg)}80%{transform:translateX(5px) rotate(1deg)}}
.lu .lucard.pop{animation:cardpop .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes cardpop{0%{transform:scale(.9)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:80}
.flash.go{animation:flash .32s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:.34}100%{opacity:0}}
.lu h2{margin:0;font-family:"Luckiest Guy";font-weight:400;font-size:clamp(40px,11vw,64px);letter-spacing:.05em;color:var(--mustard);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);opacity:0;position:relative}
.lu p{margin:0;font-size:20px;opacity:0;text-align:center;position:relative}
.lu .btn-big{max-width:340px;opacity:0;position:relative}
.lu.done h2{animation:titlepop .6s cubic-bezier(.2,1.8,.4,1) both}
.lu.done p{opacity:.9;transition:opacity .4s .2s}
.lu.done .btn-big{opacity:1;transition:opacity .3s .5s}
/* Snap-style upgrade: charge, burst, punch, shine, slam */
.lu .lucard.charge{animation:luCharge 1.25s cubic-bezier(.5,0,1,1) both}
@keyframes luCharge{
  0%{transform:none;filter:brightness(1)}
  20%{transform:translate(-1px,1px) rotate(-.6deg)} 25%{transform:translate(1px,-1px) rotate(.6deg)}
  45%{transform:translate(-3px,2px) rotate(-1.4deg) scale(1.01)} 50%{transform:translate(3px,-2px) rotate(1.4deg) scale(1.01)}
  65%{transform:translate(-5px,3px) rotate(-2.2deg) scale(1.03)} 70%{transform:translate(5px,-3px) rotate(2.2deg) scale(1.03)}
  80%{transform:translate(-7px,4px) rotate(-3deg) scale(.96)} 85%{transform:translate(7px,-4px) rotate(3deg) scale(.95)}
  90%{transform:translate(-8px,2px) rotate(-3deg) scale(.93)} 95%{transform:translate(8px,-2px) rotate(3deg) scale(.92)}
  100%{transform:scale(.9);filter:brightness(1.9) saturate(1.3)}}
.lu .lucard.charge::after{content:"";position:absolute;inset:-6%;border-radius:8%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,236,160,.9),rgba(255,190,60,.35) 60%,transparent);mix-blend-mode:screen;animation:luGlow 1.25s ease-in both}
@keyframes luGlow{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1.08)}}
.lu.charging .rays2{opacity:.55;transition:opacity 1s;animation-duration:3s}
.lu-spark{position:fixed;width:3.4vmin;height:.7vmin;margin:-.35vmin 0 0 -1.7vmin;border-radius:1vmin;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,rgba(255,240,180,0),#fff6c8 60%,#ffd25a);box-shadow:0 0 1.5vmin #ffc94a;
  rotate:var(--ang);opacity:0;animation:luPull .5s cubic-bezier(.6,0,.9,.6) both}
@keyframes luPull{from{translate:var(--sx) var(--sy);opacity:0}25%{opacity:1}to{translate:0 0;opacity:0}}
.lu .lucard.punch{animation:luPunch .75s cubic-bezier(.15,1.6,.35,1) both}
@keyframes luPunch{0%{transform:scale(.85)}35%{transform:scale(1.22)}70%{transform:scale(.97)}100%{transform:scale(1)}}
.lu .lucard.shine::before{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;border-radius:5%;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.85) 47%,rgba(255,230,150,.6) 53%,transparent 70%);background-size:300% 100%;
  mix-blend-mode:overlay;animation:luShine .9s .25s ease-in-out both}
@keyframes luShine{from{background-position:150% 0}to{background-position:-60% 0}}
.lu-shock{position:absolute;left:50%;top:42%;width:40vmin;height:40vmin;margin:-20vmin 0 0 -20vmin;border-radius:50%;pointer-events:none;
  border:2vmin solid rgba(255,236,170,.9);box-shadow:0 0 6vmin rgba(255,200,80,.8),inset 0 0 6vmin rgba(255,200,80,.6);opacity:0}
.lu.burst .lu-shock{animation:luShock .7s cubic-bezier(.1,.7,.3,1) both}
@keyframes luShock{from{transform:scale(.3);opacity:1}to{transform:scale(3.4);opacity:0;border-width:.3vmin}}
.lu-slam{position:absolute;left:50%;top:40%;z-index:5;pointer-events:none;white-space:nowrap;translate:-50% -50%;opacity:0;
  font:400 clamp(44px,14vw,84px)/1 "Luckiest Guy";letter-spacing:.04em;color:#fff3c4;-webkit-text-stroke:3px #171513;paint-order:stroke fill;
  text-shadow:0 6px 0 #171513,0 0 30px rgba(255,190,60,.9);rotate:-6deg}
.lu.slam .lu-slam{animation:luSlam 1.1s cubic-bezier(.2,1.5,.4,1) both}
@keyframes luSlam{0%{transform:scale(3.2);opacity:0}22%{transform:scale(.92);opacity:1}32%{transform:scale(1.04)}75%{transform:scale(1);opacity:1}100%{transform:scale(1.05) translateY(-8px);opacity:0}}

@keyframes titlepop{from{transform:scale(0) rotate(-10deg);opacity:0}to{opacity:1}}
.confetti{position:absolute;top:-20px;width:10px;height:14px;z-index:55;pointer-events:none;border:1px solid rgba(0,0,0,.4);animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .flash,.confetti{display:none !important}
}
.cq-reduce-motion *, .cq-reduce-motion *::before, .cq-reduce-motion *::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
.cq-reduce-motion .flash,.cq-reduce-motion .confetti{display:none !important}
/* ================= APP SHELL (native-style) ================= */
:root{--bg:#1d1a16;--bg2:#27231e;--line:rgba(241,229,201,.12);--sub:rgba(241,229,201,.62);--ui:"Patrick Hand UI","Patrick Hand",cursive;--tabh:56px}
body{overflow:hidden;background:var(--bg)}
#shell{position:fixed;inset:0;overflow:hidden}
#screens{position:absolute;left:0;right:0;top:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(ellipse at 50% -10%,rgba(255,220,160,.08),transparent 55%),var(--bg)}
.navbar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;min-height:44px;
  padding:env(safe-area-inset-top) 14px 0 10px;background:rgba(29,26,22,.82);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);
  border-bottom:.5px solid transparent;transition:border-color .2s;position:relative;z-index:3}
.screen.scrolled .navbar{border-bottom-color:var(--line)}
.nb-left{justify-self:start;min-width:0}
.nb-title{font-family:"Bangers";letter-spacing:.06em;font-size:20px;color:var(--paper);opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;text-align:center}
.screen.scrolled .nb-title,.screen.nolarge .nb-title{opacity:1}
.nb-right{justify-self:end;display:flex;gap:6px;align-items:center}
.nb-back{display:flex;align-items:center;gap:4px;background:none;border:0;color:var(--mustard);font:17px var(--ui);min-height:44px;padding:0 8px 0 4px;max-width:40vw}
.nb-back svg{width:12px;height:20px;flex:none}
.nb-back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen.scrolled .navbar.tight .nb-back span,.screen.nolarge .navbar.tight .nb-back span{display:none}
.nb-btn{position:relative;min-width:38px;height:38px;padding:0 10px;border-radius:19px;border:0;background:rgba(255,255,255,.09);color:var(--paper);font:600 16px var(--ui)}
.nb-avatar{background:none;border:0;padding:0;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:0 16px 28px}
.screen.has-cta .scr{padding-bottom:104px}
.large-title{font-family:"Luckiest Guy";font-weight:400;font-size:34px;letter-spacing:.03em;line-height:1.05;margin:6px 0 14px;color:var(--paper)}

/* tab bar */
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;padding:0 6px env(safe-area-inset-bottom);height:calc(var(--tabh) + env(safe-area-inset-bottom));
  background:rgba(24,21,17,.88);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);border-top:.5px solid var(--line)}
#tabbar button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:rgba(241,229,201,.5);font:600 10.5px var(--ui);letter-spacing:.01em;transition:color .15s}
#tabbar button svg{width:27px;height:27px;stroke-width:2.35}
#tabbar button svg .fill{fill:currentColor;stroke:none}
#tabbar button.on{color:var(--mustard)}
#tabbar button:active svg{transform:scale(.9)}
.tbadge,.dot-badge{position:absolute;min-width:18px;height:18px;border-radius:9px;padding:0 5px;background:#ff3b30;color:#fff;font:700 11px/18px var(--ui);font-style:normal;text-align:center}
.tbadge{top:4px;left:calc(50% + 5px)}
.dot-badge{top:8px;right:8px}
.dot-badge.sm{top:-4px;right:-4px}
.dot-badge.in{position:static;margin-right:6px}

/* study round = full-screen layer above the tabs */
#app{position:fixed;inset:0;z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-width:none;margin:0;
  padding:max(10px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% -10%,rgba(255,220,160,.1),transparent 60%),var(--bg)}
#app[hidden]{display:none}
#app.opening{animation:layerup .28s cubic-bezier(.2,.9,.2,1)}
@keyframes layerup{from{transform:translateY(100%)}}
.topbar .x.help{display:inline-flex;align-items:center;justify-content:center;padding:0}.topbar .x.help .ico{width:22px;height:22px}
.topbar .x{min-width:44px;min-height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.09);color:var(--paper);font:600 18px var(--ui)}

/* common building blocks */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 8px}
.sec-h span{font-family:"Bangers";letter-spacing:.07em;font-size:19px;color:var(--paper)}
.sec-h button{background:none;border:0;color:var(--mustard);font:16px var(--ui);min-height:36px}
.list{background:var(--bg2);border-radius:16px;overflow:hidden;border:.5px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:9px 12px;background:none;border:0;border-bottom:.5px solid var(--line);color:var(--paper);text-align:left;font:inherit}
.row:last-child{border-bottom:0}
button.row:active,.gcard:active,.mini:active,.tile2:active,.hero:active,.quick:active{transform:scale(.975);transition:transform .08s}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-main b{font-weight:400;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{font:13px var(--ui);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.danger b{color:#ff6b5e}
.chev{width:9px;height:15px;flex:none;color:rgba(241,229,201,.35)}
.list.info .row{min-height:46px}
.row .k{flex:1;font:15px var(--ui);color:var(--sub);display:flex;align-items:center;gap:8px}
.row .v{font:600 15px var(--ui);color:var(--paper);display:flex;align-items:center;gap:6px}
.row .v .ti{width:22px;height:22px;object-fit:contain}
.gem-dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid var(--ink)}
.th{flex:none;width:46px;height:46px;border-radius:11px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#3a342c;border:1px solid rgba(0,0,0,.4)}
.th img{width:100%;height:100%;object-fit:cover}
.th.cut{background:radial-gradient(circle at 50% 40%,#f6ead0,#c9ae7e)}
.th.cut img{object-fit:contain;padding:3px}
.th.emo{font-size:24px}
.ico{display:inline-block;width:1.2em;height:1.2em;object-fit:contain;vertical-align:-.25em}
.th .ico{width:32px;height:32px;padding:0;object-fit:contain}
.btn-big .ico{width:1.35em;height:1.35em;vertical-align:-.3em;margin-right:4px}
.hint .bulb .ico{width:10cqw;height:10cqw;vertical-align:middle}
.pts .v .ico{width:1em;height:1em}
.stage-dots .ico{width:16px;height:16px;vertical-align:-3px}
.t-ico .ico{width:34px;height:34px}
.toast .ico{margin-right:6px}
.xrow .xt{display:flex;align-items:center;gap:10px}
.xrow .xt .ico{width:28px;height:28px}
.row.q .q-reward .ico{width:22px;height:22px;vertical-align:-6px}
.chip.dbl{background:#bfe0b5}
.chip.dbl::before{content:'2× · '}
.chip .ico{width:1.25em;height:1.25em;vertical-align:-.3em}
.th.emo.trick{background:linear-gradient(135deg,#6a3aa8,#b8862a)}
.th.gi{background:rgba(255,255,255,.07);border-color:transparent;font-size:22px;color:var(--paper);font-family:var(--ui)}
.th-missing{font-family:"Luckiest Guy";font-size:22px;color:var(--mustard);background:#141210}
.mbar{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:2px}
.mbar b{display:block;height:100%;background:linear-gradient(90deg,#58a35f,#7fd08a);border-radius:3px}
.seg{display:flex;padding:3px;border-radius:12px;background:rgba(255,255,255,.08);margin:0 0 16px}
.seg button{flex:1;min-height:36px;border:0;border-radius:9px;background:none;color:var(--sub);font:600 14px var(--ui)}
.seg button.on{background:#4a4238;color:var(--paper);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:0 -16px;padding:4px 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.mini{flex:none;width:118px;scroll-snap-align:start;background:none;border:0;padding:0;color:var(--paper);text-align:center}
.mini-cap{display:block;margin-top:6px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{font:13px var(--ui);color:var(--sub);text-align:center;margin:12px 8px 0;line-height:1.4}
.empty{padding:18px;text-align:center;color:var(--sub);margin:0}
.pill{margin-left:auto;display:flex;align-items:center;gap:6px;border:0;border-radius:18px;background:rgba(255,255,255,.09);color:var(--paper);font:600 14px var(--ui);min-height:36px;padding:0 12px}

/* home dashboard */
.home-logo{font-family:"Luckiest Guy";font-size:clamp(34px,10vw,48px);line-height:1;color:var(--paper);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);transform:rotate(-2deg);margin:0 0 14px 2px;letter-spacing:.03em}
.home-logo span{display:block;color:var(--brick)}
.navbar.homebar{min-height:52px}
.navbar.homebar .nb-title{opacity:1;max-width:none;font:400 clamp(17px,4.5vw,23px)/1 "Luckiest Guy";letter-spacing:.035em;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink);transform:rotate(-1deg)}
.navbar.homebar .nb-title span{display:block;margin-top:3px;color:var(--brick)}
.navbar.homebar .nb-left,.navbar.homebar .nb-right{min-width:74px}
.navbar.homebar .nb-right{justify-content:flex-end}
.a2hs-mini{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin:0 0 12px;padding:8px 12px;border-radius:12px;border:1px solid rgba(143,179,209,.4);background:rgba(143,179,209,.12);color:var(--paper);font:14px var(--ui);text-align:left}
.a2hs-mini .chev{margin-left:auto}
.carousel + .a2hs-mini{margin:18px 0 12px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:8px;align-items:stretch;width:100%;min-height:190px;padding:18px 12px 14px 18px;border-radius:22px;border:1px solid rgba(227,178,60,.42);color:var(--paper);text-align:left;overflow:hidden;
  background:linear-gradient(135deg,rgba(207,59,42,.24),rgba(227,178,60,.08) 70%),var(--bg2);box-shadow:0 10px 24px rgba(0,0,0,.28)}
.hero.cold{border-color:rgba(143,200,255,.42);background:linear-gradient(135deg,rgba(61,127,184,.24),rgba(143,179,209,.07) 70%),var(--bg2)}
.hero-card{align-self:end;display:flex;align-items:flex-end;justify-content:center;min-width:0;margin:-6px -10px -18px 0;pointer-events:none}
.hero-card{position:relative}
.hero-card img{display:block;width:100%;height:164px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 7px 8px rgba(0,0,0,.45))}
.hero-card .ui-s3-character .s3-sepia{filter:sepia(1) saturate(.56) contrast(1.06) brightness(.92) drop-shadow(0 7px 8px rgba(0,0,0,.45))}
.hero-card .ui-s3-character .s3-color{filter:drop-shadow(0 7px 8px rgba(0,0,0,.45))}
.hero-card .ico{width:82px;height:82px;margin:auto}
.hero-character{position:absolute;left:0;right:4px;bottom:13px;padding:2px 5px;border-radius:8px;background:rgba(16,14,11,.76);color:rgba(241,229,201,.82);font:11px/1.1 var(--ui);text-align:center}
.hero-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hero-info small{font-family:"Bangers";letter-spacing:.1em;font-size:13px;color:var(--mustard)}
.hero.cold .hero-info small{color:#9fd0ff}
.hero-info b{font-family:"Luckiest Guy";font-weight:400;font-size:24px;line-height:1.05}
.hero-sub{font:13px var(--ui);color:var(--sub)}
.hero-what{font:400 18px/1.22 "Patrick Hand";color:var(--paper);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-cta{align-self:flex-start;margin-top:auto;padding:9px 14px;border-radius:12px;background:var(--brick);border:2px solid var(--ink);font-family:"Luckiest Guy";font-size:15px;letter-spacing:.045em;box-shadow:0 3px 0 var(--ink)}
.hero.cold .hero-cta{background:#3d7fb8}
.home-cards{margin-top:14px}
.home-cards .sec-h{margin-top:0}
.home-rewards-label{margin-top:16px}
.home-save{margin:16px 0 2px;background:transparent;border:1px solid rgba(143,179,209,.3)}
.home-save b{text-decoration:none}
.home-weekly{margin-top:14px}
.home-weekly .dk-home{min-height:60px;margin-bottom:10px;padding:7px 10px;border-color:rgba(207,59,42,.34);background:rgba(207,59,42,.07)}
.home-weekly .dk-home img{width:42px}
.home-weekly .dk-home em{font-size:13px}.home-weekly .dk-home b{font-size:16px}.home-weekly .dk-home small{font-size:13px}
.home-weekly .dk-home i{background:rgba(255,255,255,.06);color:var(--sub)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile2{position:relative;display:flex;align-items:center;gap:10px;min-height:78px;padding:10px;border-radius:18px;border:.5px solid var(--line);background:var(--bg2);color:var(--paper);text-align:left}
.tile2 b{display:block;font-weight:400;font-size:17px;line-height:1.1}
.tile2 small{display:block;font:12px var(--ui);color:var(--sub);margin-top:2px}
.tile2 .t-pack{height:56px;transform:rotate(-8deg);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.tile2 .t-ico{font-size:34px;width:52px;text-align:center}
.tile2.icy{border-color:rgba(143,200,255,.45);background:linear-gradient(135deg,rgba(120,180,255,.18),transparent),var(--bg2)}
.collection-cards{margin-bottom:10px}
.collection-cards .sec-h{margin-top:10px}

/* study hub */
.quick{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:14px 16px;border-radius:18px;border:2px solid var(--ink);background:var(--brick);color:#fff8ea;
  font-family:"Luckiest Guy";font-size:22px;letter-spacing:.04em;box-shadow:0 5px 0 var(--ink);text-align:left}
.quick small{font:13px var(--ui);letter-spacing:0;opacity:.85;margin-top:2px}

/* collection */
.summary{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--bg2);border:.5px solid var(--line)}
.summary b{display:block;font-weight:400;font-size:19px}
.summary small{display:block;font:13px var(--ui);color:var(--sub)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px}
.cgrid.two{grid-template-columns:repeat(2,1fr)}
@media (min-width:700px){.cgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.gcard{background:none;border:0;padding:0}
.gl small{display:block;text-align:center;font:13px var(--ui);color:var(--sub);margin-top:6px}

/* card page */
.cd-top{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.cd-card{width:min(62vw,300px,calc((100dvh - 330px) / 1.5))}
.stage-dots{display:flex;gap:8px;margin-top:12px}
/* Readiness (separate from XP): Profile panel and a card's recall dots */
.rd-panel{margin:0 0 16px;padding:14px 16px;border-radius:16px;background:var(--bg2);border:1.5px solid var(--line)}
.rd-top{display:flex;align-items:baseline;justify-content:space-between}
.rd-top b{font:400 20px/1 "Bangers",sans-serif;letter-spacing:.04em}
.rd-top span{font:400 30px/1 "Luckiest Guy",sans-serif;color:var(--mustard)}
.rd-bar{height:10px;margin:10px 0 8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.rd-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#7fb98a,#e3b23c)}
.rd-panel small{display:block;color:var(--sub);font-size:14px;line-height:1.3}
.rc-row{display:flex;align-items:center;gap:10px;margin:8px 0 4px;font-size:15px}
.rc-row > span:first-child{color:var(--sub)}
.rc-row small{margin-left:auto;color:var(--sub);font-size:14px}
.rc-pips{display:inline-flex;gap:4px}
.rc-pips i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--sub);opacity:.6}
.rc-pips i.on{background:#7fb98a;border-color:#7fb98a;opacity:1}
.stage-dots button{width:34px;height:34px;border-radius:17px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--paper);font-family:"Luckiest Guy";font-size:14px}
.stage-dots button.cur{background:var(--mustard);color:var(--ink);border-color:var(--ink)}
.stage-dots button.lk{font-size:12px;opacity:.45}
.preview-note{margin:6px 0 0;font:13px var(--ui);color:var(--mustard)}
.cd-name{font-family:"Luckiest Guy";font-weight:400;font-size:26px;letter-spacing:.03em;margin:14px 0 2px;text-align:center}
.cd-level{display:flex;justify-content:space-between;font:13px var(--ui);color:var(--sub);margin:6px 2px 2px}
.cd-level + .mbar{margin-bottom:16px}
.cd-panel .rulebox,.cd-panel .mnbox,.cd-panel .diffbox{color:var(--ink)}
.cd-panel .lore{color:var(--paper)}
.hookbox{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(123,75,181,.22);border:1px solid rgba(190,140,255,.35);font-size:16px;line-height:1.35}
.cd-panel .coldnote{margin:12px 0 0;color:var(--ink)}
.screen .cta-bar{position:absolute;left:0;right:0;bottom:0;padding:18px 16px 12px;z-index:3}
.btn-big.coldbtn{background:#3d7fb8}

/* packs screen */
.packs-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin:4px 0 16px}
.packs-hero img{height:min(40dvh,300px);filter:drop-shadow(0 14px 20px rgba(0,0,0,.6))}
.packs-hero img.bob{animation:packidle 2.4s ease-in-out infinite}
.packs-hero img.dim{filter:grayscale(.7) brightness(.6)}
.packs-hero b{font-weight:400;font-size:22px;margin-top:8px}
.packs-hero small{font:14px var(--ui);color:var(--sub)}
.btn-big[disabled]{opacity:.45;box-shadow:none}

/* profile + stats */
.prof-head{display:flex;align-items:center;gap:16px;margin:0 0 14px}
.prof-head b{display:block;font-family:"Luckiest Guy";font-weight:400;font-size:24px}
.prof-head small{display:block;font:13px var(--ui);color:var(--sub);margin-top:4px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat4.three{grid-template-columns:repeat(3,1fr)}
.stat4 div{padding:10px 4px;border-radius:14px;background:var(--bg2);border:.5px solid var(--line);text-align:center}
.stat4 b{display:block;font-family:"Luckiest Guy";font-weight:400;font-size:20px;color:var(--mustard)}
.stat4 small{font:11px var(--ui);color:var(--sub)}
.bars{display:grid;gap:8px;padding:12px;border-radius:16px;background:var(--bg2);border:.5px solid var(--line)}
.bars div{display:grid;grid-template-columns:44px 1fr 28px;align-items:center;gap:8px;font:13px var(--ui);color:var(--sub)}
.bars i{display:block;height:12px;min-width:3px;border-radius:6px;background:linear-gradient(90deg,var(--mustard),#f7d56a)}
.bars b{font:600 13px var(--ui);color:var(--paper);text-align:right}
.xrow{border-bottom:.5px solid var(--line)}
.xrow:last-child{border-bottom:0}
.xrow summary{display:flex;align-items:center;justify-content:space-between;min-height:54px;padding:0 14px;font-size:18px;list-style:none;cursor:pointer}
.xrow summary::-webkit-details-marker{display:none}
.xrow[open] summary .chev{transform:rotate(90deg)}
.xrow div{padding:0 14px 14px;font:15px/1.45 var(--ui);color:var(--sub)}

/* bottom sheets */
.sheet-wrap{position:fixed;inset:0;z-index:85}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fadein .18s both}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:8px 16px calc(14px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:#2b2621;border-top:.5px solid var(--line);
  box-shadow:0 -12px 40px rgba(0,0,0,.5);animation:layerup .24s cubic-bezier(.2,.9,.2,1) both;transition:transform .18s}
.sheet-wrap.closing .sheet{transform:translateY(105%);transition:transform .18s ease-in}
.sheet-wrap.closing .sheet-bg{opacity:0;transition:opacity .18s}
.grabber{width:38px;height:5px;border-radius:3px;background:rgba(241,229,201,.28);margin:0 auto 12px}
.sheet h3{font-family:"Bangers";font-weight:400;letter-spacing:.06em;font-size:24px;margin:2px 0 10px;text-align:center}
.sh-head{display:flex;align-items:center;gap:12px;padding:0 4px 12px}
.sh-head b{display:block;font-weight:400;font-size:19px}
.sh-head small{font:13px var(--ui);color:var(--sub)}
.acts{background:var(--bg2);border-radius:14px;overflow:hidden}
.acts button{display:block;width:100%;min-height:52px;padding:0 16px;border:0;border-bottom:.5px solid var(--line);background:none;color:var(--paper);font:17px var(--ui);text-align:left}
.acts button:last-child{border-bottom:0}
.acts button.danger{color:#ff6b5e}
.acts button[disabled]{opacity:.4}
.acts-sep{padding:10px 16px 6px;font:600 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--sub);background:rgba(0,0,0,.18)}
.sheet-cancel{display:block;width:100%;min-height:52px;margin-top:10px;border:0;border-radius:14px;background:var(--bg2);color:var(--mustard);font:600 17px var(--ui)}
.sheet-cancel small{display:block;font:13px var(--ui);color:var(--sub);margin-top:2px}
.intro{display:flex;flex-direction:column;gap:10px;margin:0 2px 14px}
.intro-sec{padding:12px 14px;border-radius:14px;background:var(--bg2)}
.intro-sec em{display:block;font:400 17px/1 "Bangers";letter-spacing:.06em;font-style:normal;color:var(--mustard);margin-bottom:6px}
.intro-sec p{margin:0;font:18px/1.4 var(--ui);color:var(--paper)}
.intro-sec.ex{border-left:4px solid var(--mustard)}
.intro-src{margin:0 4px;font:14px var(--ui);color:var(--sub)}
.sheet .btn-big{margin-top:6px}
.as-q{margin:0 4px 14px;font:17px/1.4 var(--ui);color:var(--paper)}
.as-list{display:flex;flex-direction:column;gap:10px}
.as-list button{display:flex;align-items:stretch;width:100%;min-height:56px;padding:0;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#f6e7c8;color:var(--ink);text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.as-list button b{flex:none;width:46px;display:flex;align-items:center;justify-content:center;background:#5d7d8c;border-right:3px solid var(--ink);color:#fff;font:400 26px "Luckiest Guy";-webkit-text-stroke:1px var(--ink)}
.as-list button span{padding:10px 12px;font:20px/1.25 "Patrick Hand"}
.as-list button.hl{outline:3px solid var(--mustard);outline-offset:2px}
.as-list button:active{transform:translateY(2px)}
.sh-missing{display:flex;flex-direction:column;align-items:center;text-align:center}
.sh-mcard{width:120px;margin-bottom:6px}
.sh-missing p{font:15px/1.4 var(--ui);color:var(--sub);margin:0 8px 14px}
.steps{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:10px}
.steps li{display:flex;align-items:center;gap:12px;font:16px var(--ui)}
.steps li span{flex:none;width:28px;height:28px;border-radius:14px;background:var(--mustard);color:var(--ink);font:700 15px/28px var(--ui);text-align:center}
.shareico{display:inline-block;border:1.5px solid currentColor;border-radius:4px;padding:0 4px;font-size:13px;font-style:normal}

/* alerts */
.alert-wrap{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);animation:fadein .15s both}
.alert{width:min(280px,78vw);border-radius:16px;overflow:hidden;background:rgba(48,44,38,.97);text-align:center;animation:alertin .2s cubic-bezier(.2,1.3,.4,1) both}
@keyframes alertin{from{transform:scale(1.12);opacity:0}}
.alert h4{margin:18px 16px 4px;font:600 17px var(--ui);color:#fff}
.alert p{margin:0 16px 16px;font:13px/1.35 var(--ui);color:rgba(255,255,255,.75)}
.alert .btns{display:flex;border-top:.5px solid rgba(255,255,255,.18)}
.alert .btns button{flex:1;min-height:44px;border:0;background:none;color:#4da3ff;font:17px var(--ui)}
.alert .btns button + button{border-left:.5px solid rgba(255,255,255,.18)}
.alert .btns .bold{font-weight:600}
.alert .btns .destructive{color:#ff453a}


/* ===== Phase 2 ===== */
.row.q .q-claim{flex:none;min-height:36px;padding:0 16px;border-radius:18px;border:2px solid var(--ink);background:var(--mustard);color:var(--ink);font:700 15px var(--ui);box-shadow:0 3px 0 var(--ink)}
.row.q .q-claim:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.row.q .q-reward{flex:none;font:600 13px var(--ui);color:var(--sub)}
.row.q .q-done{flex:none;width:28px;height:28px;border-radius:14px;background:#3f8f4a;color:#fff;font:700 15px/28px var(--ui);text-align:center}
.row.q .row-main b{white-space:normal;line-height:1.1}
.row.q.ready{background:linear-gradient(90deg,rgba(227,178,60,.14),transparent)}
.row.q.claimed .row-main b{opacity:.6}
.pill.gold{background:var(--mustard);color:var(--ink);border:2px solid var(--ink);font-weight:700}
.reward{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:10px}
.reward img{height:150px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.reward img.bob{animation:packidle 2.4s ease-in-out infinite}
.reward p{margin:0;font:15px var(--ui);color:var(--sub)}
.reward b{margin-top:6px;font-family:"Luckiest Guy";font-weight:400;font-size:22px;color:var(--mustard)}
.acts.checks button{display:flex;align-items:center;justify-content:space-between}
.acts.checks button span{color:var(--mustard);font-weight:700}
.toggle-row{display:flex !important;align-items:center;justify-content:space-between}
.sw{position:relative;flex:none;width:51px;height:31px;border-radius:16px;background:rgba(255,255,255,.18);transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:#34c759}
.sw.on::after{transform:translateX(20px)}
