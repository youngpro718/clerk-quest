<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clerk Quest">
<link rel="apple-touch-icon" href="art/app_icon.webp">
<link rel="icon" href="art/app_icon.webp">
<title>Clerk Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Courier+Prime:wght@400;700&family=Luckiest+Guy&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1b17; --paper:#f1e5c9; --paper2:#e8d8b4; --brick:#cf3b2a; --navy:#2b3a55;
  --mustard:#e3b23c; --sage:#9bb68a; --sky:#8fb3d1; --desk:#211e1a;
  --good:#3f8f4a; --bad:#c23a2b;
  --common:#8d8d8d; --uncommon:#5f9e5a; --rare:#3f78c9; --epic:#8a4fc2; --legendary:#d8a526;
  --cw:min(calc(100vw - 32px), 470px);
}
@supports (height:100dvh){ :root{ --cw:min(calc(100vw - 32px), 470px, calc((100dvh - 150px) / 1.5)); } }
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
body{
  min-height:100vh; color:var(--paper); font-family:"Patrick Hand",system-ui,sans-serif; font-size:18px;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,220,160,.10), transparent 60%),
    radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.5), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 7px),
    var(--desk);
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:1100px;margin:0 auto;padding:max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left))}

/* ---------- CARD ---------- */
.card{position:relative;width:100%;aspect-ratio:1024/1536;container-type:inline-size;user-select:none}
.card > *{position:absolute}
.card .frame{inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.card .bg{inset:0;width:100%;height:100%;z-index:0}
.t{z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;color:var(--ink);font-family:"Luckiest Guy",sans-serif}
.art-win{z-index:1;overflow:hidden;border-radius:2.5cqw;background:#2a2622}
.art-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art-back{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%, #f6ead0 0%, #e2cc9f 45%, #9c8360 100%)}
.art-back::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(#7a5a3a,#5e4329);border-top:.5cqw solid #3b2a1a;opacity:.55}
.art-bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.9) saturate(.92)}
.art-vig{position:absolute;inset:0;background:radial-gradient(ellipse 70% 65% at 50% 55%, transparent 55%, rgba(20,12,4,.45) 100%)}
.art-img.cut{inset:1% 2% 12% 2%;width:96%;height:87%;object-fit:contain;z-index:1;filter:drop-shadow(0 1.2cqw 0 rgba(0,0,0,.25))}
.art-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 45%, #efe2c3 0%, #d9c49b 45%, #6d5b43 100%)}
.ph-emoji{font-size:30cqw;filter:drop-shadow(0 1.2cqw 0 rgba(0,0,0,.25));transform:translateY(-4%)}
.ph-tag{position:absolute;top:9%;left:50%;transform:translateX(-50%) rotate(-3deg);font-family:"Bangers";letter-spacing:.06em;
  font-size:3.6cqw;color:var(--ink);background:rgba(255,255,255,.55);padding:.6cqw 2cqw;border:.35cqw dashed var(--ink);border-radius:1cqw;white-space:nowrap}
.stk{position:absolute;z-index:2;transform:rotate(var(--r,0deg));pointer-events:none}
.stk.note{font-family:"Patrick Hand";color:var(--ink);padding:1.4cqw 2.2cqw;line-height:1;
  box-shadow:.4cqw .6cqw 0 rgba(0,0,0,.25);border:.25cqw solid rgba(0,0,0,.55);white-space:nowrap}
.stk.emo{line-height:1;filter:drop-shadow(.4cqw .6cqw 0 rgba(0,0,0,.3))}
.stk.float{animation:float 3s ease-in-out infinite}
.stk.float2{animation:float 3.6s ease-in-out -1.2s infinite}
@keyframes float{50%{transform:rotate(var(--r,0deg)) translateY(-2.5cqw)}}
.foil{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 45%,rgba(180,220,255,.18) 52%,transparent 62%);
  background-size:300% 100%;animation:foil 4.5s linear infinite}
.lv5 .foil{background-image:linear-gradient(115deg,transparent 35%,rgba(255,236,160,.45) 45%,rgba(255,200,80,.25) 52%,transparent 62%)}
@keyframes foil{from{background-position:100% 0}to{background-position:-100% 0}}
.rays{position:absolute;inset:-30%;z-index:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.8;
  background:repeating-conic-gradient(from 0deg at 50% 45%, rgba(255,220,120,.9) 0 6deg, transparent 6deg 18deg);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* front texts */
.num{font-size:7.2cqw;letter-spacing:.04em}
.xpstrip{flex-direction:column;gap:1cqw;color:#f6ecd4;font-family:"Bangers";font-size:3.4cqw;letter-spacing:.06em}
.xpstrip i{display:block;width:80%;height:1.6cqw;border-radius:1cqw;background:rgba(0,0,0,.35);overflow:hidden;border:.25cqw solid rgba(0,0,0,.4)}
.xpstrip b{display:block;height:100%;background:linear-gradient(90deg,#f7d56a,#e3a42c)}
.cat{font-size:3.7cqw;padding:0 2cqw;letter-spacing:.045em;line-height:1.08}
.icon svg{width:70%;height:70%}
.icon img{width:92%;height:92%;object-fit:contain}
.card.special .cat,.card.special .lvl,.card.special .xpstrip{color:#fff;text-shadow:0 .3cqw 0 rgba(0,0,0,.5)}
.card.special .stars{color:#fff}
.title{flex-direction:column;gap:1.2cqw}
.title span{display:block;white-space:nowrap;letter-spacing:.035em;line-height:1.02}
.t1{color:var(--ink);text-shadow:0 .5cqw 0 rgba(0,0,0,.12)}
.t2{color:var(--brick);-webkit-text-stroke:.38cqw var(--ink);paint-order:stroke fill;text-shadow:0 .6cqw 0 rgba(0,0,0,.18)}
.quote{font-family:"Patrick Hand";font-size:6.4cqw;line-height:1.05;white-space:pre-line;transform:rotate(-2deg);
  text-decoration:underline;text-decoration-color:var(--brick);text-decoration-thickness:.45cqw;text-underline-offset:1.4cqw}
.rar{flex-direction:column;gap:1.4cqw;font-size:4.2cqw;letter-spacing:.04em}
.gem{width:9.5cqw;height:9.5cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:5.4cqw;
  border:.45cqw solid var(--ink);box-shadow:inset 0 -1cqw 0 rgba(0,0,0,.2), inset 0 .8cqw 0 rgba(255,255,255,.35)}
.r-special{background:linear-gradient(135deg,#8a4fc2,#d8a526)}
.r-common{background:var(--common)} .r-uncommon{background:var(--uncommon)} .r-rare{background:var(--rare)} .r-epic{background:var(--epic)} .r-legendary{background:var(--legendary)}
.set{flex-direction:column;gap:1cqw;font-size:4.1cqw;letter-spacing:.04em;padding:0 2cqw}
.set small{font-family:"Bangers";font-size:3.4cqw;letter-spacing:.08em}
.set hr{width:80%;border:0;border-top:.3cqw solid var(--ink);margin:0}
.lvl{flex-direction:column;gap:1.4cqw;font-size:4.5cqw;letter-spacing:.04em}
.stars{font-size:4.4cqw;letter-spacing:.1cqw;color:var(--ink)}
.stars .on{color:#e8a91d;-webkit-text-stroke:.25cqw var(--ink)}
.stars .off{opacity:.35}
.stars .new{display:inline-block;animation:starpop .7s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1)}}
.spark{z-index:4;color:#fff5c2;font-size:5cqw;text-shadow:0 0 2cqw #ffd76a;animation:twinkle 1.8s ease-in-out infinite;pointer-events:none}
@keyframes twinkle{50%{opacity:.15;transform:scale(.6)}}

/* level glows follow the card's transparent corners */
.card.lv2{filter:drop-shadow(0 0 .6cqw rgba(255,255,255,.35))}
.card.lv3{filter:drop-shadow(0 0 1.2cqw rgba(90,160,255,.7))}
.card.lv4{filter:drop-shadow(0 0 1.6cqw rgba(170,100,255,.8))}
.card.lv5{animation:goldglow 2.4s ease-in-out infinite}
@keyframes goldglow{0%,100%{filter:drop-shadow(0 0 1.4cqw rgba(255,200,60,.7))}50%{filter:drop-shadow(0 0 3.2cqw rgba(255,210,80,1))}}
.card.locked{filter:grayscale(1) brightness(.7)}
.card.special{filter:drop-shadow(0 0 1.4cqw rgba(190,120,255,.85))}
/* memory trick art */
.mn{position:absolute;inset:0}
.mn-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mn-badge{position:absolute;left:1%;top:0;width:25%;z-index:3;transform:rotate(-10deg);filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.4))}
.mn-paper{position:absolute;left:11%;right:9%;top:15%;bottom:20%;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;
  padding:3cqw;border:.45cqw solid var(--ink);border-radius:1.6cqw;transform:rotate(-1.5deg);box-shadow:.8cqw 1cqw 0 rgba(0,0,0,.35);
  background:repeating-linear-gradient(0deg,transparent 0 6.6cqw,rgba(80,120,170,.2) 6.6cqw 6.9cqw),#fbf6e8}
.mn-tag{font-family:"Bangers";letter-spacing:.08em;font-size:4.2cqw;background:#7b4bb5;color:#fff;padding:.6cqw 2.6cqw;border-radius:1.4cqw;border:.35cqw solid var(--ink);transform:rotate(-3deg)}
.mn-row{display:flex;gap:1.2cqw;justify-content:center}
.mn-tile{aspect-ratio:.82;border:.4cqw solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(var(--r));box-shadow:.4cqw .6cqw 0 rgba(0,0,0,.3);border-radius:.8cqw}
.mn-tile b{font-family:"Luckiest Guy";font-weight:400;line-height:1;color:var(--ink)}
.mn-tile small{font-family:"Patrick Hand";color:var(--ink);line-height:1;margin-top:.5cqw;white-space:nowrap}
.mn-means{display:grid;gap:.8cqw 4cqw;font-family:"Patrick Hand";color:var(--ink);line-height:1.1}
.mn-means b{font-family:"Luckiest Guy";font-weight:400;color:#7b4bb5;margin-right:1cqw}
.ttype{display:flex;align-items:center;gap:10px;margin:14px 0 0}
.ttype img{width:56px;height:56px;object-fit:contain}
.ttype b{display:block;font-family:"Luckiest Guy";font-weight:400;font-size:20px;letter-spacing:.04em}
.ttype span{font-size:17px;opacity:.8}
.diffbox{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.dcol{border:2px solid var(--ink);border-radius:12px;padding:10px;font-size:16px}
.dcol.a{background:#ffe3b8} .dcol.b{background:#cfe3ff}
.dcol b{display:block;font-family:"Luckiest Guy";font-weight:400;font-size:20px;letter-spacing:.04em}
.dcol i{display:block;margin:4px 0 6px;font-size:17px}
.dcol ul{margin:0;padding-left:18px;line-height:1.25}
.dvs{align-self:center;font-family:"Luckiest Guy";font-size:22px;color:var(--brick)}
@media (max-width:480px){.diffbox{grid-template-columns:1fr}.dvs{text-align:center}}
.mnbox{background:#fbf6e8;border:2px dashed rgba(0,0,0,.35);border-radius:12px;padding:12px 14px}
.mnsent{font-size:22px;margin:0 0 8px;font-style:italic}
.mnlist{margin:0 0 8px;padding-left:0;list-style:none;display:grid;gap:4px;font-size:18px}
.mnlist b{display:inline-block;width:28px;text-align:center;font-family:"Luckiest Guy";font-weight:400;color:#fff;background:#7b4bb5;border-radius:6px;margin-right:8px}
.mntip{margin:0;font-size:17px;opacity:.85}
/* card back (pack reveal) */
.cback{position:absolute;inset:0;border-radius:7%/4.7%;border:3px solid #f1e5c9;box-shadow:0 0 0 3px var(--ink),0 10px 18px rgba(0,0,0,.55);
  background:radial-gradient(circle at 50% 50%,#3a4d70 0 30%,transparent 31%),repeating-linear-gradient(45deg,#2b3a55 0 10px,#26344d 10px 20px);display:flex;align-items:center;justify-content:center}
.cback span{font-family:"Luckiest Guy";color:#f1e5c9;text-align:center;font-size:clamp(14px,4vw,24px);line-height:.95;letter-spacing:.04em;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;transform:rotate(-8deg)}
.cback span i{font-style:normal;color:var(--brick)}
/* home pack button */
.packbtn{display:flex;align-items:center;gap:14px;width:100%;margin:14px 0 0;padding:10px 16px;border:3px solid var(--ink);border-radius:16px;background:var(--mustard);color:var(--ink);box-shadow:0 6px 0 var(--ink);text-align:left}
.packbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.packbtn img{height:74px;transform:rotate(-8deg);animation:packidle 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.packbtn b{display:block;font-family:"Luckiest Guy";font-weight:400;font-size:22px;letter-spacing:.05em}
.packbtn small{font-size:17px}
.packnote{text-align:center;margin:14px 0 0;opacity:.75;font-size:17px}
/* pack opening */
.pk{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;
  background:radial-gradient(circle at 50% 42%,rgba(70,48,14,.92),rgba(0,0,0,.96));overflow:hidden;animation:fadein .3s both}
.pk-rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:42%;translate:-50% -50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,210,90,.12) 0 8deg,transparent 8deg 20deg);animation:spin 30s linear infinite}
.pk-stage{position:relative;width:min(94vw,600px);height:min(60vh,520px);display:flex;align-items:center;justify-content:center}
.pk-pack{position:absolute;width:min(56vw,250px,36vh);aspect-ratio:640/975;border:0;background:none;padding:0;z-index:3;animation:packidle 2.4s ease-in-out infinite}
.pk-pack img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 14px 18px rgba(0,0,0,.6))}
@keyframes packidle{50%{transform:translateY(-8px) rotate(1.5deg)}}
.pk-pack.shake{animation:shake .45s linear 2}
.pk-pack.torn{animation:none;pointer-events:none}
.pk-pack.torn .pk-top{transition:transform .7s cubic-bezier(.3,.8,.4,1),opacity .6s .25s;transform:translate(35%,-130%) rotate(30deg);opacity:0}
.pk-pack.torn .pk-body{transition:transform .8s .5s ease-in,opacity .5s .85s;transform:translateY(80%);opacity:0}
.pk-cards{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.4vw,18px);z-index:2;pointer-events:none}
.pk-card{position:relative;width:min(29vw,170px,22vh);aspect-ratio:1024/1536;border:0;background:none;padding:0;perspective:1000px;opacity:0;transform:translateY(45%) scale(.45);
  transition:transform .7s cubic-bezier(.2,1.4,.4,1),opacity .4s;transition-delay:calc(.55s + var(--i) * .18s)}
.pk.out .pk-cards{pointer-events:auto}
.pk.out .pk-card{opacity:1;transform:none}
.pk.out .pk-card:nth-child(1){transform:rotate(-6deg) translateY(12px)}
.pk.out .pk-card:nth-child(3){transform:rotate(6deg) translateY(12px)}
.pk-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,1.3,.5,1)}
.pk-card.flipped .pk-inner{transform:rotateY(180deg)}
.pk-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pk-front{transform:rotateY(180deg)}
.pk-card:not(.flipped) .pk-front,.pk-card.flipped .pk-back{pointer-events:none}
.cbackimg{width:100%;height:100%;object-fit:cover;border-radius:6%/4%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.pk-badge{position:absolute;left:50%;top:-12px;translate:-50% 0;z-index:9;font-family:"Bangers";letter-spacing:.06em;font-size:clamp(13px,3.4vw,18px);padding:3px 10px;border:2px solid var(--ink);border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .3s .45s;color:var(--ink)}
.pk-card.flipped .pk-badge{opacity:1}
.pk-badge.new{background:#ffe27a} .pk-badge.dup{background:#bfe0b5} .pk-badge.trick{background:#d6c2ff}
.pk-hint{margin:0;font-size:20px;color:var(--paper);z-index:3;text-align:center;min-height:26px}
.pk-done{max-width:340px;z-index:3;opacity:0;pointer-events:none;transition:opacity .3s}
.pk.all .pk-done{opacity:1;pointer-events:auto}

/* stamps */
.stamp{z-index:6;font-family:"Luckiest Guy";padding:1.2cqw 3cqw;border:.9cqw solid currentColor;border-radius:2cqw;letter-spacing:.07em;
  background:rgba(255,255,255,.12);mix-blend-mode:multiply;opacity:.92;transform:rotate(-12deg);pointer-events:none;
  -webkit-mask-image:radial-gradient(circle at 30% 40%, #000 60%, rgba(0,0,0,.75) 100%);animation:slam .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{0%{transform:rotate(-12deg) scale(2.4);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:.92}}
.stampimg{position:absolute;z-index:6;pointer-events:none;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.35));animation:slamimg .35s cubic-bezier(.2,1.6,.4,1) both}
.stampimg.big{width:58%;left:21%;top:23.5%;--rot:-6deg}
.card.cold .art-win > *{filter:saturate(.2) brightness(.92) contrast(.95)}
.card.cold .art-win::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:linear-gradient(160deg,rgba(190,225,255,.3),rgba(120,170,220,.15) 60%,rgba(220,240,255,.35))}
.card.cold{filter:drop-shadow(0 0 1.2cqw rgba(140,200,255,.7))}
.mn-badge.low{top:auto;bottom:17%;left:1%;width:21%}
.goingcold{position:absolute;z-index:7;width:34%;right:3%;top:26%;pointer-events:none;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.4));animation:wobble 2.2s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-2deg) scale(1.06)}}
.stampimg.coldcase{width:70%;left:15%;top:38%;--rot:-12deg;z-index:7}
.stampimg.mastered{width:52%;right:2%;top:57%;--rot:-10deg}
@keyframes slamimg{0%{transform:rotate(var(--rot)) scale(2.2);opacity:0}100%{transform:rotate(var(--rot)) scale(1);opacity:1}}
.stampimg{transform:rotate(var(--rot))}
.stamp.mastered{color:#b8860b;font-size:7cqw;right:4%;top:56%}
.stamp.big{font-size:11cqw;left:50%;top:26%;translate:-50% 0}
.stamp.ok{color:var(--good)} .stamp.no{color:var(--bad)}

/* back */
.lvtag{font-size:6.8cqw;letter-spacing:.04em;transform:rotate(-3deg)}
.counter{font-family:"Bangers";font-size:4.6cqw;letter-spacing:.05em}
.bnum{font-size:6.2cqw;letter-spacing:.04em}
.brar{font-family:"Bangers";font-size:3.8cqw;letter-spacing:.08em;color:#fff}
.bcat{font-family:"Bangers";font-size:3.5cqw;letter-spacing:.04em;line-height:1.05;padding:0 1cqw}
.qtext{font-family:"Patrick Hand";justify-content:flex-start;text-align:left;padding:0 2cqw;line-height:1.12;color:var(--ink)}
.ans{z-index:3;border:0;padding:0;background:url(art/answer_button.webp) center/100% 100% no-repeat;display:flex;align-items:center;
  transition:transform .12s, filter .2s;touch-action:manipulation}
.ans:hover:not([disabled]){transform:translateX(.8cqw)}
.ans:active:not([disabled]){transform:scale(.97)}
.ans .L{width:17.4%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Luckiest Guy";font-size:6cqw;-webkit-text-stroke:.3cqw var(--ink);paint-order:stroke fill}
.ans .A{flex:1;text-align:left;padding-left:3cqw;padding-right:1.5cqw;font-family:"Patrick Hand";font-size:5cqw;color:var(--ink);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ans .A.wrap{white-space:normal;line-height:1.02;overflow:visible}
.ans.right{filter:drop-shadow(0 0 1.4cqw rgba(63,143,74,.9))}
.ans.right .A{color:#1f6b2b;font-weight:bold}
.ans.wrong{opacity:.6}
.ans.wrong .A{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:.5cqw}
.ans[disabled]{cursor:default}

const LASTS = ['Kowalski','Rodriguez','Nguyen','Okafor','Fitzgerald','Castellano','Abramowitz','Mahmoud','Sullivan','Delgado','Petrakis','Washington','Harrington','Morrissey','Goldstein','Villanueva','Tanaka','Brennan','Olsson','Pellegrino'];

const DIGITALIKE = {'0':'8','1':'7','2':'7','3':'8','4':'9','5':'6','6':'5','7':'1','8':'3','9':'4'};

function mutate(s, lv){
  const ops = [];
  const letters = [...s].map((ch,i)=>/[a-z]/i.test(ch)&&i>0?i:-1).filter(i=>i>0);
  const digits = [...s].map((ch,i)=>/\d/.test(ch)?i:-1).filter(i=>i>=0);
  ops.push(() => { // change a letter
    const i = pick(letters); const ch = s[i], low = ch.toLowerCase();
    let r = lv<=2 ? pick('abcdefghijklmnoprstuvwy'.split('').filter(x=>x!==low)) : (LOOKALIKE[low] || 'e');
    if (ch !== low) r = r.toUpperCase();
    return s.slice(0,i) + r + s.slice(i+1);
  });
  if (digits.length && lv>=2) ops.push(() => { const i = pick(digits); return s.slice(0,i) + (lv<=2 ? String((+s[i]+1+rnd(8))%10) : DIGITALIKE[s[i]]) + s.slice(i+1); });
  if (lv>=3) {
    const pairs = [];
    for (let i=0;i<s.length-1;i++) if (/\d/.test(s[i]) && /\d/.test(s[i+1]) && s[i]!==s[i+1]) pairs.push(i);
    if (pairs.length) ops.push(() => { const i = pick(pairs); return s.slice(0,i) + s[i+1] + s[i] + s.slice(i+2); });
    const m = s.match(/ ([A-Z])\. /g);
    if (m && m.length > 1) ops.push(() => s.replace(/ ([A-Z])\. (\d)/, (_, L, d) => ` ${L==='M'?'N':'M'}. ${d}`));
  }
  if (lv>=4) {
    const dbl = s.search(/([a-z])\1/i);
    if (dbl > 0) ops.push(() => s.slice(0,dbl) + s.slice(dbl+1));
    const lp = [];
    for (let i=1;i<s.length-1;i++) if (/[a-z]/.test(s[i]) && /[a-z]/.test(s[i+1]) && s[i]!==s[i+1]) lp.push(i);
    if (lp.length) ops.push(() => { const i = pick(lp); return s.slice(0,i) + s[i+1] + s[i] + s.slice(i+2); });
  }
  for (let t=0;t<20;t++){ const out = pick(ops)(); if (out !== s) return out; }
  return s + 'x';
}
function markDiff(a, b){
  let p = 0; while (p < a.length && p < b.length && a[p] === b[p]) p++;
  let q = 0; while (q < a.length-p && q < b.length-p && a[a.length-1-q] === b[b.length-1-q]) q++;
  const m = (s) => esc(s.slice(0,p)) + `<mark>${esc(s.slice(p, s.length-q)) || '&nbsp;'}</mark>` + esc(s.slice(s.length-q));
  return [m(a), m(b)];
}

    if (lv === 2) return Math.random() < .5 ? `${last}, ${first}` : `Index ${20+rnd(6)}-${String(rnd(99999)).padStart(5,'0')}`;
    return `${last}, ${first[0]}. ${mi}. ${num}`;
  };
  const rows = [];
  for (let i=0;i<n;i++){

    rows.push([a, same.has(i) ? a : mutate(a, lv)]);
  }
  const diffs = rows.map((r,i)=>({i, r})).filter(x => x.r[0] !== x.r[1]);
  const why = (diffs.length ? diffs.map(d => { const [ma, mb] = markDiff(d.r[0], d.r[1]); return `<p class="mono"><b>Pair ${d.i+1}:</b> ${ma}<br>&nbsp;&nbsp;vs&nbsp;&nbsp;${mb}</p>`; }).join('') : '')

  return { type:'table', q:'How many of these pairs are EXACTLY alike?', rows, opts, a:String(alike),
    h:'Read each pair letter by letter and digit by digit. Errors love to hide in the middle.', w:why, raw:true };

const FAMS = [
  ['Smith','Smithson','Smyth','Smithers','Smit','Smithe'],
  ['Martin','Martinez','Martino','Marten','Martins','Marti'],
  ['Johnson','Johns','Johnston','Johnstone','Jonas','Johnsen'],
  ['Castell','Castellano','Castillo','Castro','Castle','Castelli'],
  ['Rodgers','Roderick','Rodman','Rodriguez','Rodin','Rodd'],
  ['Kowal','Kowalski','Kowalczyk','Kovac','Kowalsky'],
];
const cmp = (a,b) => { a=a.toLowerCase(); b=b.toLowerCase(); return a<b?-1:a>b?1:0; };
const nameCmp = (x,y) => cmp(x.last,y.last) || cmp(x.first,y.first) || cmp(x.mi||'', y.mi||'');
const fmt = x => `${x.last}, ${x.first}${x.mi ? ' '+x.mi+'.' : ''}`;
function genAlpha(lv){
  let names = [];
  const key = x => fmt(x).toLowerCase();
  const add = x => { if (!names.some(y => key(y)===key(x))) names.push(x); };
  let guard = 0;
  while (names.length < 4 && guard++ < 200){
    if (lv === 1) {
      const last = pick(LASTS);
      if (!names.some(y => y.last[0]===last[0])) add({last, first:pick(FIRSTS)});
    } else if (lv === 2) {
      const fam = names.length ? names._fam : (names._fam = pick(FAMS));
      add({last:pick(fam), first:pick(FIRSTS)});
    } else if (lv === 3) {
      if (!names._fam) { names._fam = pick(FAMS); names._same = pick(names._fam); }
      add(names.length < 2 ? {last:names._same, first:pick(FIRSTS)} : {last:pick(names._fam), first:pick(FIRSTS)});
    } else {
      if (!names._fam) { names._fam = pick(FAMS); names._same = pick(names._fam); names._first = pick(['Ann','Anna','Anne','Andrea','Rob','Robert','Roberta','Robin']); }
      const r = Math.random();
      if (r < .4) add({last:names._same, first:names._first, mi: Math.random()<.35 ? '' : pick('ABCDJKLMRST'.split(''))});
      else if (r < .75) add({last:names._same, first:pick(['Ann','Anna','Anne','Andrea','Rob','Robert','Roberta','Robin'])});
      else add({last:pick(names._fam), first:pick(FIRSTS)});
    }
  }
  const sorted = names.slice().sort(nameCmp);
  const ord = lv<=3 ? pick([['FIRST',0],['LAST',3]]) : pick([['SECOND',1],['THIRD',2]]);
  const answer = fmt(sorted[ord[1]]);
  const prefixCase = sorted.some((x,i)=> sorted.some((y,j)=> i!==j && y.last.toLowerCase().startsWith(x.last.toLowerCase()) && y.last.length > x.last.length));
  const sameLast = new Set(sorted.map(x=>x.last)).size < sorted.length;
  let rule = 'File by LAST name, letter by letter.';
  if (prefixCase) rule = 'Nothing comes before something: a shorter name that matches the start of a longer one is filed first (Smith before Smithson).';
  if (sameLast) rule += ' When last names match, go to the first name, then the middle initial. No middle initial comes first.';
  const why = `<p><b>Filing order:</b></p><p>${sorted.map((x,i)=>`${i+1}. ${i===ord[1]?'<mark>':''}${esc(fmt(x))}${i===ord[1]?'</mark>':''}`).join('<br>')}</p><p>${esc(rule)}</p>`;
  return { type:'mc', q:`Alphabetical filing: which name should be filed ${ord[0]}?`, opts:shuffle(names.map(fmt)), a:answer,
    h:'Last name first, letter by letter. If last names match, use the first name, then the middle initial.', w:why, raw:true };
}
function genSequence(c, lv){
  const m = c.mnemonic, n = m.means.length, pool = m.means.concat(m.extra||[]);
  const others = (skip) => shuffle(pool.filter(x => !skip.includes(x))).slice(0,3);
  const table = (hi) => `<p>${m.letters.map((L,j)=>`${hi.includes(j)?'<mark>':''}<b>${L}</b> = ${esc(m.means[j])}${hi.includes(j)?'</mark>':''}`).join('<br>')}</p>`;
  if (lv === 1) {
    const i = rnd(n), a = m.means[i];
    return { type:'mc', q:`Memory trick: "${m.sentence}". What does "${m.words[i]}" (${m.letters[i]}) stand for?`, opts:shuffle([a, ...others([a])]), a,
      h:`It starts with the letter ${m.letters[i]}.`, w:table([i]), raw:true };
  }
  if (lv === 2) {
    const i = rnd(n-1), a = m.means[i+1];
    return { type:'mc', q:`Using "${m.sentence}": what comes right AFTER ${m.means[i]}?`, opts:shuffle([a, ...others([a, m.means[i]])]), a,
      h:`Find the letter after ${m.letters[i]}.`, w:table([i, i+1]), raw:true };
  }
  const idx = shuffle([...Array(n).keys()]).slice(0,3).sort((x,y)=>x-y);
  const right = idx.map(j=>m.means[j]).join(' → ');
  const perms = [[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]].map(p => p.map(k => m.means[idx[k]]).join(' → '));
  return { type:'mc', q:`Which list is in the CORRECT order? (Hint: "${m.sentence}")`, opts:shuffle([right, ...shuffle(perms).slice(0,3)]), a:right,
    h:'Say the memory trick out loud, one word at a time.', w:table(idx), raw:true };
}
function nextQuestion(c, lv, used){
  if (c.mnemonic && (c.gen === 'sequence' || Math.random() < .4)) return genSequence(c, lv);
  if (c.gen === 'compare') return genCompare(lv);
  if (c.gen === 'alpha') return genAlpha(lv);
  let pool = c.bank.filter(q => q.lv === lv && !used.has(q.q));
  if (!pool.length) pool = c.bank.filter(q => q.lv === lv);
  const q = pick(pool); used.add(q.q);
  return { type: q.type || 'mc', q:q.q, opts: q.type==='tf' ? q.c.slice() : shuffle(q.c), a:q.a, h:q.h, w:q.w };
}

  return best;
}

}
function answer(v){
  if (!sess || sess.answered) return;
  const c = byId(sess.id), st = S.cards[sess.id];
  const ok = v === sess.q.a;
  const lvBefore = st.level;
  let gain = 0;
  S.stats.answered++; sess.results[sess.i] = ok;
  if (ok) {
    S.stats.correct++;
    gain = Math.round(REWARD[st.level-1] * (sess.hint ? .5 : 1));
    if (sess.wasCold && !sess.reopened) { sess.reopened = true; sess.justReopened = true; gain += COLD_BONUS; }
    st.last = Date.now();
    S.stats.xp += gain; sess.xp += gain;
    if (!st.mastered) {
      st.xp += gain;
      if (st.xp >= NEED[st.level-1]) {
        sess.display = {level:st.level, xp:NEED[st.level-1], mastered:false};
        if (st.level < maxL(c)) { st.xp -= NEED[st.level-1]; st.level++; sess.pendingLevel = {from:lvBefore, to:st.level}; }
        else { st.xp = NEED[st.level-1]; st.mastered = true; sess.pendingLevel = {from:st.level, to:st.level, mastered:true}; }
      }
    }
  }
  save();
  sess.answered = { choice:v, ok, gain, reopened: !!sess.justReopened }; sess.justReopened = false;
  paintStudy();
}
function next(){
  if (sess.pendingLevel) { const pl = sess.pendingLevel; sess.pendingLevel = null; showLevelUp(sess.id, pl, () => { sess.display = null; advance(); }); return; }
  advance();
}
function advance(){
  sess.i++;
  if (sess.i >= SESSION_LEN) { S.stats.sessions++; S.packs++; save(); return renderResults(); }
  const c = byId(sess.id);
  sess.q = nextQuestion(c, S.cards[sess.id].level, sess.used);
  sess.hint = false; sess.answered = null; sess.display = null;
  // refresh the front face too (hidden, but keeps level in sync)
  document.querySelector('.face.front').innerHTML = cardEl(c, S.cards[sess.id]);
  paintStudy(true);
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---- level up ---- */
function showLevelUp(id, pl, done){
  const c = byId(id), st = S.cards[id];
  const before = {level:pl.from, xp:NEED[pl.from-1], mastered:false};
  const ov = document.createElement('div');
  ov.className = 'lu';
  ov.innerHTML = `<div class="rays2"></div><div class="lucard" id="lucard">${cardEl(c, before)}</div>
    <h2>${pl.mastered ? 'MASTERED!' : 'LEVEL UP!'}</h2>
    <p>${pl.mastered ? `${esc(c.name)} is fully mastered.` : `${esc(c.name)} is now <b>Level ${pl.to}</b>. New art, harder questions.`}</p>
    <button class="btn-big gold" data-act="lu-close">KEEP GOING →</button>`;
  document.body.appendChild(ov);
  const lc = ov.querySelector('#lucard');
  setTimeout(() => lc.classList.add('shake'), 550);
  setTimeout(() => { const f = document.getElementById('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }, 1050);
  setTimeout(() => {
    lc.classList.remove('shake');
    lc.innerHTML = cardEl(c, st, {newStar: pl.mastered ? 0 : pl.to});
    lc.classList.add('pop'); ov.classList.add('done'); confetti(ov);
  }, 1150);
  ov._done = () => { ov.remove(); done && done(); };
}
function confetti(host){
  const colors = ['#e3b23c','#cf3b2a','#8fb3d1','#9bb68a','#f1e5c9','#c8b6ff'];
  for (let i=0;i<46;i++){
    const d = document.createElement('div'); d.className = 'confetti';
    d.style.left = Math.random()*100 + '%'; d.style.background = pick(colors);
    d.style.setProperty('--dx', (Math.random()*160-80) + 'px'); d.style.setProperty('--rot', (Math.random()*900-450) + 'deg');
    d.style.animationDuration = (1.6 + Math.random()*1.4) + 's'; d.style.animationDelay = (Math.random()*.3) + 's';
    host.appendChild(d); setTimeout(() => d.remove(), 3500);
  }
}

/* ---- card packs ---- */
const DUP_XP = 25;
function addCardXP(id, amt){
  const c = byId(id), st = S.cards[id]; if (st.mastered) return false;
  st.xp += amt; let up = false;
  while (st.xp >= NEED[st.level-1]) {
    if (st.level < maxL(c)) { st.xp -= NEED[st.level-1]; st.level++; up = true; }
    else { st.xp = NEED[st.level-1]; st.mastered = true; up = true; break; }
  }
  return up;
}
function drawPack(){
  const owned = c => S.cards[c.id].owned;
  const regular = CARDS.filter(c => !c.trickType), tricks = CARDS.filter(c => c.trickType);
  const newRegular = shuffle(regular.filter(c => !owned(c))), newTricks = shuffle(tricks.filter(c => !owned(c)));
  const picks = []; const take = c => { if (c && !picks.includes(c)) picks.push(c); };
  if (S.guarantee && newTricks.some(c => c.id === S.guarantee)) { take(byId(S.guarantee)); S.guarantee = null; }
  else if (S.packsOpened === 0 && newTricks.length) take(newTricks[0]);      // first pack always shows a Memory Trick
  else if (Math.random() < .2) take(newTricks[0] || pick(tricks));      // after that, 1 in 5 packs
  take(newRegular[0]);                                                  // at least one new card while any remain
  let guard = 0;
  while (picks.length < 3 && guard++ < 60) take(newRegular.length > 1 && Math.random() < .5 ? pick(newRegular) : pick(regular));
  return shuffle(picks).map(c => {
    const st = S.cards[c.id], isNew = !st.owned; let up = false;
    if (isNew) st.owned = true; else up = addCardXP(c.id, DUP_XP);
    return { c, isNew, up, st:{...st} };
  });
}
function zig(y){ const pts = []; for (let i=0;i<=16;i++) pts.push(`${(i/16*100).toFixed(1)}% ${(y + (i%2 ? 1.4 : -1.4)).toFixed(1)}%`); return pts; }
function openPack(){
  if (S.packs <= 0) return;
  S.packs--; const first = S.packsOpened === 0; S.packsOpened++;
  const pulls = drawPack(); save();
  const ov = document.createElement('div'); ov.className = 'pk';
  const topClip = `polygon(0% 0%, 100% 0%, ${zig(12).reverse().join(',')})`, bodyClip = `polygon(${zig(12).join(',')}, 100% 100%, 0% 100%)`;
  ov.innerHTML = `<div class="pk-rays"></div>
    <div class="pk-stage">
      <button class="pk-pack" data-act="pk-tear" aria-label="Open the pack">
        <img class="pk-body" src="art/pack.webp" alt="" style="clip-path:${bodyClip}">
        <img class="pk-top" src="art/pack.webp" alt="" style="clip-path:${topClip}">
      </button>
      <div class="pk-cards">${pulls.map((p,i) => `<button class="pk-card" data-act="pk-flip" style="--i:${i}" aria-label="Reveal card ${i+1}">
        <div class="pk-inner"><div class="pk-face pk-back"><img class="cbackimg" src="art/cardback.webp" alt="Card back"></div>
        <div class="pk-face pk-front">${cardEl(p.c, p.st)}</div></div>
        <span class="pk-badge ${p.isNew ? (p.c.trickType ? 'trick' : 'new') : 'dup'}">${p.isNew ? (p.c.trickType ? '🧠 MEMORY TRICK!' : 'NEW!') : `+${DUP_XP} XP${p.up ? ' · LEVEL UP!' : ''}`}</span>
      </button>`).join('')}</div>
    </div>
    <p class="pk-hint">${first ? 'Your first pack! Tap it to tear it open.' : 'Tap the pack to tear it open.'}</p>
    <button class="btn-big gold pk-done" data-act="pk-done">COLLECT →</button>`;
  document.body.appendChild(ov);
}
function tearPack(btn){
  const ov = btn.closest('.pk'); if (ov.classList.contains('out')) return;
  btn.classList.add('shake');
  setTimeout(() => {
    btn.classList.remove('shake'); btn.classList.add('torn');
    const f = document.getElementById('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    ov.classList.add('out'); ov.querySelector('.pk-hint').textContent = 'Tap each card to flip it.';
  }, 900);
}
function flipPackCard(card){
  if (card.classList.contains('flipped')) return;
  card.classList.add('flipped');
  const ov = card.closest('.pk');
  if (card.querySelector('.pk-badge.new, .pk-badge.trick')) confetti(ov);
  if (!ov.querySelector('.pk-card:not(.flipped)')) { ov.classList.add('all'); ov.querySelector('.pk-hint').textContent = 'Nice pull! New cards are in your collection.'; }
}

/* ---- results ---- */
function renderResults(){
  const c = byId(sess.id), st = S.cards[sess.id];
  const correct = sess.results.filter(Boolean).length;
  const need = NEED[st.level-1];
  const left = need - st.xp;
  const answers = Math.ceil(left / REWARD[st.level-1]);
  const leveled = st.level > sess.startLevel;
  view = { name:'results' };
  app.innerHTML = `
    <div class="results">
      <h1>SESSION ADJOURNED</h1>
      <div class="score">${correct} / ${SESSION_LEN}</div>
      <div class="sub">correct answers</div>
      <div class="rchips"><span class="chip">+${sess.xp} XP</span>${sess.reopened ? `<span class="chip" style="background:#bfe0ff">🔥 CASE REOPENED</span>` : ''}${leveled ? `<span class="chip">★ LEVEL ${sess.startLevel} → ${st.level}</span>` : ''}<span class="chip">🎁 +1 CARD PACK</span></div>
      <div class="rcard">${cardEl(c, st)}</div>
      <div class="panel">
        <b>${esc(c.name)}</b> · Level ${st.level}
        <div class="pbar" style="margin-top:10px"><b style="width:${st.mastered?100:Math.round(st.xp/need*100)}%"></b></div>
        <div class="prow"><span>${st.mastered ? 'MASTERED' : `${st.xp} / ${need} XP`}</span><span>${st.mastered ? '🏅' : `${left} XP to go`}</span></div>
        ${st.mastered ? '' : `<div class="almost">${answers <= 2 ? `Almost ${st.level<maxL(c)?`Level ${st.level+1}`:'MASTERED'}! Just ${answers} more correct.` : `About ${answers} correct answers to ${st.level<maxL(c)?`Level ${st.level+1}`:'MASTERED'}.`}</div>`}
      </div>
      <div class="stack">
        <button class="btn-big" data-act="study" data-id="${c.id}">▶ ONE MORE ROUND</button>
        <button class="btn-big gold" data-act="pack-open">🎁 OPEN YOUR PACK</button>
        <button class="btn-big alt" data-act="home">Back to collection</button>
      </div>
    </div>`;
  window.scrollTo({top:0});
}

/* ================= ROUTER / EVENTS ================= */
function render(){
  if (view.name === 'home') renderHome();
  else if (view.name === 'detail') renderDetail();
  window.scrollTo({top:0});
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const act = t.dataset.act;
  if (act === 'home') { sess = null; view = {name:'home'}; render(); }
  else if (act === 'open') { view = {name:'detail', id:t.dataset.id}; render(); }
  else if (act === 'study') startSession(t.dataset.id);
  else if (act === 'answer') answer(t.dataset.v);
  else if (act === 'hint') { if (!sess.answered) { sess.hint = true; paintStudy(); } }
  else if (act === 'next') next();
  else if (act === 'lu-close') { const ov = t.closest('.lu'); ov && ov._done(); }
  else if (act === 'stage') { view.preview = +t.dataset.l; renderDetail(); }
  else if (act === 't-level') {
    const st = S.cards[view.id]; const from = st.level;
    if (st.mastered) return;
    let pl;
    const c = byId(view.id);
    if (st.level < maxL(c)) { st.level++; st.xp = 0; pl = {from, to:st.level}; } else { st.mastered = true; st.xp = NEED[st.level-1]; pl = {from:st.level, to:st.level, mastered:true}; }
    save(); view.preview = null;
    showLevelUp(view.id, pl, () => renderDetail());
  }
  else if (act === 't-reset') { Object.assign(S.cards[view.id], {level:1,xp:0,mastered:false}); save(); view.preview = null; renderDetail(); }
  else if (act === 't-cold') { const st = S.cards[view.id]; st.last = Date.now() - coldAfter(st) - DAY; save(); view.preview = null; renderDetail(); }
  else if (act === 'pack-open') openPack();
  else if (act === 'pk-tear') tearPack(t);
  else if (act === 'pk-flip') flipPackCard(t);
  else if (act === 'pk-done') { t.closest('.pk').remove(); sess = null; view = {name:'home'}; render(); }
  else if (act === 't-pack') { S.packs++; save(); render(); }
  else if (act === 'resetall') { if (confirm('Reset all Clerk Quest progress?')) { S = normalize(null); save(); render(); } }
});

probeArt().then(render);
</script>
